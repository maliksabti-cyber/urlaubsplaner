<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schicht &amp; Urlaub</title>
<meta name="theme-color" content="#D9480F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schicht">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Figtree:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}</style>
<script src="config.js"></script>
<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: ein Schichtbuch in der Hosentasche – oben "Heute", darunter Monatsraster wie ein Dienstplan-Aushang, Tabs unten */
:root{
  --paper:#F2F4F3; --card:#FFFFFF; --ink:#16222B; --soft:#5B6873; --rule:#D5DBDE; --tint:#E7ECEE;
  --accent:#D9480F; --accent-ink:#FFFFFF; --focus:#1C6DD0; --ok:#2E8B57; --warn:#B7791F; --bad:#C0392B;
  --hol:#9A6A00; --hol-bg:#FFF1CC; --free-bg:#CFEBD6; --free-ink:#17663A; --free-bd:#A9D8B6; --fer:#7B4FC4;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(22,34,43,.07),0 4px 14px rgba(22,34,43,.05);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0F1519; --card:#172027; --ink:#E6ECEF; --soft:#94A2AC; --rule:#2A3740; --tint:#1E2A32;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --focus:#6FA8FF; --ok:#5CC98A; --warn:#E8B04B; --bad:#FF7B6E;
  --hol:#F2C14E; --hol-bg:#3A2E0E; --free-bg:#1C3B28; --free-ink:#93DBAA; --free-bd:#2D5C3F; --fer:#B99AF0; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1519; --card:#172027; --ink:#E6ECEF; --soft:#94A2AC; --rule:#2A3740; --tint:#1E2A32;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --focus:#6FA8FF; --ok:#5CC98A; --warn:#E8B04B; --bad:#FF7B6E;
  --hol:#F2C14E; --hol-bg:#3A2E0E; --free-bg:#1C3B28; --free-ink:#93DBAA; --free-bd:#2D5C3F; --fer:#B99AF0; --shadow:none; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:7px;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
h1{font:700 26px/1 var(--f-display);letter-spacing:.01em;margin:0;text-transform:uppercase}
.bar small{display:block;color:var(--soft);font-size:12px;margin-top:2px}
h2{font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font:600 13px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin:0 0 8px}
.sec{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px;box-shadow:var(--shadow);min-width:0}
.muted{color:var(--soft)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:9px 13px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:1px solid var(--rule);background:var(--card);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;font-size:18px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--soft);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:9px 10px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:90px;resize:vertical;font-family:var(--f-mono);font-size:12px}
.banner{border:1px dashed var(--warn);color:var(--ink);background:transparent;border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--warn)}

/* Schicht-Plakette */
.chip{--c:#888;display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 8px;border-radius:6px;background:var(--c);color:#fff;font:700 15px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.chip.free{background:var(--free-bg);color:var(--free-ink);border:1px solid var(--free-bd)}
.chip.dark{color:#16222B}
.chip.deep{box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}

/* Heute */
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.today .big{width:84px;height:84px;border-radius:12px;display:grid;place-items:center;font:700 44px/1 var(--f-display);color:#fff}
.today .big.free{background:var(--free-bg);color:var(--free-ink);border:1px solid var(--free-bd)}
.today .big.dark{color:#16222B}
.today .t1{font:700 30px/1 var(--f-display);text-transform:uppercase}
.today .live{font-weight:700;font-size:14px;margin-top:4px;color:var(--soft)}.today .live.run{color:var(--ok)}
.stat b{white-space:nowrap}.stats3 .stat{min-width:0}.stats3 .stat b{font-size:clamp(17px,5.2vw,30px)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week button{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:6px 2px;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--soft)}
.week button.now{border-color:var(--ink)}
.week .chip{min-width:0;width:100%;max-width:40px;height:24px;font-size:14px;padding:0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat b{display:block;font:700 30px/1 var(--f-display)}
.stat span{font-size:12px;color:var(--soft)}
.meter{height:8px;border-radius:4px;background:var(--tint);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--ok)}

/* Monat */
.mhead{display:flex;align-items:center;gap:8px}
.mhead h2{flex:1;text-align:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 14px;font-weight:600;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font:600 12px var(--f-body);color:var(--soft);text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.day{position:relative;border:1px solid var(--rule);background:var(--card);border-radius:8px;min-height:64px;padding:4px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.day.out{opacity:.38;filter:saturate(.35)}
.day.out .dn{font-weight:500}
.day.out.now{border-color:var(--rule)}
.day.we .dn{color:var(--soft)}
.day.now{border:2px solid var(--ink)}
.day.hol{background:var(--hol-bg)}
.day.fday,.week button.fday{background:var(--free-bg);border-color:var(--free-bd)}
.day.fday .dn,.week button.fday{color:var(--free-ink)}
.day.fday .chip,.week button.fday .chip{background:transparent;border:0;color:var(--free-ink)}
.day.vday,.week button.vday{background:var(--vbg,#2E8B57);border-color:var(--vbg,#2E8B57);color:#fff}
.day.vday .dn,.day.vday .tm,.day.vday .hn{color:#fff}
.day.vday .chip,.week button.vday .chip{background:transparent!important;border:0!important;color:#fff}
.day.vday .chip.invac,.week button.vday .chip.invac{background:var(--c)!important;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.85);opacity:.95}
.day.vday .chip.invac.dark,.week button.vday .chip.invac.dark{color:#16222B}
.day .vtm{font-weight:700;color:#fff!important}
.day.vday .fer{background:#fff}
.day.fday.now,.day.vday.now{border:2px solid var(--ink)}
.day.sel{outline:3px solid var(--focus);outline-offset:-2px}
.dn{font:600 13px/1 var(--f-body);font-variant-numeric:tabular-nums}
.day .chip{min-width:0;width:100%;height:auto;flex:1;min-height:30px;font-size:17px;padding:0 2px}
.day .ovr{position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.day .both{position:absolute;top:1px;right:3px;font-style:normal;font-size:11px;line-height:1;color:var(--bad)}
.day .nt{position:absolute;top:3px;left:4px;width:6px;height:6px;border-radius:1px;background:var(--focus)}
.day .swp{position:absolute;top:1px;left:3px;font-style:normal;font-size:11px;line-height:1;font-weight:800;color:var(--focus)}.day.vday .swp{color:#fff}
.day .nt+.swp{left:12px}
.day .hn{font-size:9px;line-height:1.1;color:var(--hol);font-weight:700;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--soft)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .chip{height:20px;min-width:26px;font-size:13px}
.hint{font-size:13px;color:var(--soft)}
/* Jahresplaner */
.yplan{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));gap:6px}
.yplan[hidden]{display:none}
.yptop{display:flex;align-items:center;gap:6px}.yptop h2{font-size:18px;text-align:center}
.yphint{margin:0;font-size:13px;color:var(--soft);text-align:center}
.ypgrid{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(0,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.yph{background:var(--ink);color:var(--paper);font:700 12px/1.9 var(--f-body);text-align:center;text-transform:uppercase}
.ypc{background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:2px;padding:0 3px;font:600 11px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink);min-width:0;overflow:hidden;position:relative}
.ypc.none{background:var(--tint)}
.ypc.sa{background:#FBEBC8}.ypc.so{background:#F2C79B;font-weight:800}
.ypc.fe{background:#FFF07A}.ypc.so.fe{background:#F2C79B}
.ypc.ho{color:#C0392B;font-weight:800;background:#F7D0C9}
.ypc.va{background:#C9EBD3;box-shadow:inset 5px 0 0 #2E9E5B}
.ypc.now{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
.ypc.sel{background:#FFD3BC!important;color:#16222B!important;box-shadow:inset 5px 0 0 #D9480F}
.ypd{white-space:nowrap;overflow:hidden;text-overflow:clip}
.yps{flex:none;min-width:13px;height:13px;border-radius:3px;font:800 9px/13px var(--f-body);text-align:center}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .ypc.sa{background:#3A3420} :root:not([data-theme="light"]) .ypc.so{background:#4A3420} :root:not([data-theme="light"]) .ypc.fe{background:#4A4410} :root:not([data-theme="light"]) .ypc.ho{background:#4A2420;color:#FF9A8E} :root:not([data-theme="light"]) .ypc.va{background:#1F4A30} :root:not([data-theme="light"]) .ypc.sel{background:#6A3418!important;color:#fff!important} }
:root[data-theme="dark"] .ypc.sa{background:#3A3420}:root[data-theme="dark"] .ypc.so{background:#4A3420}:root[data-theme="dark"] .ypc.fe{background:#4A4410}:root[data-theme="dark"] .ypc.ho{background:#4A2420;color:#FF9A8E}:root[data-theme="dark"] .ypc.va{background:#1F4A30}:root[data-theme="dark"] .ypc.sel{background:#6A3418!important;color:#fff!important}
.yplg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--soft);justify-content:center}.yplg span{display:inline-flex;align-items:center;gap:4px}.yplg .ypc{width:14px;height:12px;border:1px solid var(--rule);border-radius:3px;padding:0}
.ypbar{display:flex;align-items:center;gap:8px;height:76px;overflow:hidden;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px 10px;min-height:56px}
.ypbar small{display:block;color:var(--soft);font-size:12px;line-height:1.25}.ypbar b{font-size:15px}.ypbar .btn{min-height:44px}
.ypopen{width:100%;min-height:48px}
.ypseg{align-self:center}.ypseg button{min-height:36px;padding-top:4px;padding-bottom:4px}
.ypbrush{display:flex;gap:6px;overflow-x:auto;padding:2px 0}.ypb{flex:none;display:grid;justify-items:center;gap:1px;min-width:52px;padding:3px 5px;border:2px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.ypb .chip{height:20px;min-width:26px;font-size:12px;padding:0 4px}.ypb small{font-size:11px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ypb[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}

.todaycard{gap:12px}.nextline{font-weight:600;border-top:1px solid var(--rule);padding-top:10px}
.vhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.vhead h3{margin:0}
.vbig{font:700 30px/1 var(--f-display)}.small{font-size:13px}
.vcard .row .btn{min-height:46px}
.nxrow{display:flex;gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--rule)}.nxrow:first-of-type{border-top:0}
.nxrow small{display:block;color:var(--soft);font-size:12px}.nxi{width:32px;height:32px;flex:none;border-radius:8px;background:var(--tint);display:grid;place-items:center}
.guide h2{font-size:19px}.guide summary{font-size:14px}.guide .gnext small{font-size:13px}

.vpick .mc{border:0;font:inherit;cursor:pointer;color:inherit}
.vpick .mc.inrange{background:var(--free-bg);box-shadow:inset 0 0 0 2px var(--ok)}
.vpick .mc.edge{background:var(--ok)}.vpick .mc.edge i{color:#fff;font-weight:800}
.vpick .mc.off{opacity:.45}
.vrest .bad,.vrest .muted{display:block}.vrest .bad{color:var(--bad);font-weight:700}
.vpsum{display:grid;gap:2px}.vpsum b{font-size:22px}.vpsum .bad{color:var(--bad);font-weight:700}
.vlist{display:grid;gap:0;margin-top:14px}.vlist h3{margin:0 0 4px}
.vlist .vrow b{display:block}.vlist .vrow .num{font-weight:700;white-space:nowrap}
/* Kopfzeile mit Zurück-Pfeil bleibt über offenen Fenstern bedienbar */
header.bar{z-index:25}
.sheet .pan{max-height:calc(100% - 72px - env(safe-area-inset-top,0px))}
.shareico{color:var(--accent);border-color:var(--accent)}
.seg.full3{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.seg.full3 button{padding:9px 4px}
.prev .mc{min-height:40px}.prev .mc.hol i{color:var(--hol);font-weight:700}
.years.sm{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.years.sm .mini h4{font-size:13px;margin:0 0 4px}
#pan[data-sheet="ag"] h3{font:700 18px/1.25 var(--f-body);color:var(--ink);text-transform:none;letter-spacing:0;margin:10px 0 0}
#pan[data-sheet="ag"] .hint{font-size:15px;color:var(--ink)}
#pan[data-sheet="ag"] .presets{gap:8px}
#pan[data-sheet="ag"] .presets .btn{font-size:16px;padding:11px 14px;min-height:46px}
#pan[data-sheet="ag"] .presets .btn.pri{box-shadow:0 0 0 2px var(--accent)}
#pan[data-sheet="ag"] .sw{font-size:16px;font-weight:600;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--tint)}
#pan[data-sheet="ag"] .agplan{font-size:22px;font-family:var(--f-display);text-transform:uppercase;margin-top:6px}
#pan[data-sheet="ag"] .agitem{padding:12px 14px}
#pan[data-sheet="ag"] .agitem .muted{font-size:14px}
.aglab{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.agdate{display:block;font-size:18px;line-height:1.25}
#pan[data-sheet="ag"] .gain b{font-size:20px}
#pan[data-sheet="ag"] .gain small{font-size:13px}
.guide{border-color:var(--accent)}
.glist{display:grid;gap:4px}
.gstep,.gnext{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.gnext{border-top:0;padding:4px 0}
.gstep small,.gnext small{display:block;color:var(--soft);font-size:13px}
.gstep.done{opacity:.6}
.gnum{width:28px;height:28px;flex:none;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800;font-size:14px}
.gstep.done .gnum{background:var(--ok)}
.gstep .btn{flex:none;padding:7px 10px;font-size:13px}
.gstep{flex-wrap:wrap}.gstep .grow{flex:1 1 60%}
.gstep .ck{width:34px;height:34px;font-size:15px}
.goalgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.goalbtn{display:grid;gap:2px;justify-items:start;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:12px;padding:10px}
.goalbtn .gi{font-size:22px;line-height:1}
.goalbtn b{font-size:14px;line-height:1.2}
.goalbtn small{color:var(--soft);font-size:12px;line-height:1.25}
#help{font-weight:800;font-size:18px}
.news{border-color:var(--accent)}
.newsrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--rule);background:none;padding:10px 0}
.newsrow small{display:block;color:var(--soft)}
.newsi{width:36px;height:36px;flex:none;border-radius:9px;background:var(--tint);display:grid;place-items:center;font-size:18px}
details{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--card)}
details>summary{cursor:pointer;font-weight:600;color:var(--ink)}
details[open]{display:grid;gap:10px}

/* Jahr */
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mini h4{margin:0 0 6px;font:700 16px var(--f-display);text-transform:uppercase}
.mini .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini i{aspect-ratio:1;border-radius:3px;background:var(--tint);display:grid;place-items:center;max-width:100%;font:600 10px/1 var(--f-body);font-style:normal;font-variant-numeric:tabular-nums;color:var(--soft)}
.mini i.e{color:transparent}.mini .wdh{font:700 9px/1.4 var(--f-body);color:var(--soft);text-align:center}.mini i.hd{text-decoration:underline;font-weight:800}
.mini i.e{background:transparent}
.mini i.now{outline:2px solid var(--ink)}
.mini button{border:0;background:none;padding:0;text-align:left;width:100%}

/* Statistik */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid var(--rule);text-align:left}
.tbl th{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.tbl td.r,.tbl th.r{text-align:right}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:130px;border-bottom:1px solid var(--rule);padding-top:16px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;min-width:0}
.bars i{display:block;width:70%;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}
.bars i.cur{background:var(--ink)}
.bars small{font-size:10px;color:var(--soft)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* Urlaubsrechner */
.agsum{display:grid;gap:6px}
.agbig{font:700 26px/1.05 var(--f-display);color:var(--accent)}
.agitem{display:flex;gap:12px;align-items:center;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--card);cursor:pointer}

.btn.ai{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Schicht-Leiste rechts (senkrecht) */
body.painting .wrap{padding-right:88px}
body.painting #selchips{position:fixed;right:8px;top:calc(64px + env(safe-area-inset-top,0px));bottom:calc(140px + env(safe-area-inset-bottom,0px));width:72px;z-index:8;display:flex;flex-direction:column;gap:6px;overflow-y:auto;overflow-x:hidden;padding:8px 6px;background:var(--card);border:1px solid var(--rule);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.16)}

.chip.rst{border-color:var(--soft);color:var(--ink)}
#selchips .bl{font-size:10.5px;line-height:1.1;font-weight:600;color:var(--soft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body:not(.painting) #selchips .bl{display:none}
/* Rotations-Tool */
.rstep{display:flex;align-items:center;gap:8px;margin-top:6px}
.rnum{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font-weight:800;font-size:13px;flex:none}
.rstep b{font-size:16px}
.pick button[aria-pressed="true"]{border-color:var(--ink)}
/* Rotation: Blöcke & Vorschau */
.smart{border:1px solid var(--accent);background:var(--tint);border-radius:10px;padding:12px;display:grid;gap:6px}
.smart.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
.blocks{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:auto 1fr auto auto auto auto;gap:6px;align-items:center}
.brow select{padding:7px 8px}
.brow .icon-btn{width:34px;height:34px}
.brow b{min-width:18px;text-align:center;font:700 20px var(--f-display)}
.endseg{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
.endseg button{padding:8px 4px;font-size:13px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mcal .dw{text-align:center;font-size:11px;color:var(--soft);font-weight:700}
.mcal .mc{display:grid;justify-items:center;gap:2px;padding:3px 0;border-radius:6px;background:var(--paper);min-height:44px}
.mcal .mc i{font-style:normal;font-size:11px;color:var(--soft)}
.mcal .mc .chip{min-width:0;width:80%;height:20px;font-size:12px;padding:0}
.mcal .mc.off{opacity:.35}
.mcal .mc.out{opacity:.38;filter:saturate(.35)}
.mcal .mc.first{outline:2px solid var(--accent)}
.mcal button.mc{border:0;font:inherit;color:inherit;cursor:pointer}
.mcal .mc.vd{background:var(--free-bg);box-shadow:inset 0 0 0 2px var(--ok)}
.mcal .mc.hol i{color:var(--hol);font-weight:700}
.mcal .mc .chip.invac{background:var(--c)!important;color:#fff;box-shadow:0 0 0 2px var(--ok)}.mcal .mc .chip.invac.dark{color:#16222B}
.swipem{touch-action:none;user-select:none;-webkit-user-select:none}
.mnav{display:flex;align-items:center;gap:6px}.mnav h4{flex:1;text-align:center;margin:0;font-size:15px}
.seg.hseg{width:max-content;max-width:100%;margin:0 auto}.hseg button{min-width:96px}
.sumline{margin-top:8px;font-weight:600}
/* Rückfrage */
.ask{position:fixed;inset:0;z-index:60;background:rgba(10,15,20,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.ask[hidden]{display:none}
.askc{background:var(--card);color:var(--ink);border-radius:14px;padding:18px;max-width:420px;width:100%;display:grid;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.askc p{margin:0}.askc .askline{font-weight:600}
.askb{display:grid;gap:8px;margin-top:8px}
.chip.blank{background:transparent!important;border:0!important;color:transparent}
.rrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:10px 12px}
.rrow small{display:block;color:var(--soft)}.rrow .row{margin-top:6px;gap:4px}.rrow .chip{height:22px;min-width:24px;font-size:13px}
/* Start-Woche wählen */
.wkpick{display:grid;gap:6px}
.wkb{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;border:2px solid var(--rule);background:var(--card);border-radius:10px;padding:8px 10px}
.wkb[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.wkb b{white-space:nowrap}
.wkrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wkrow .chip{width:100%;min-width:0;padding:0;height:22px;font-size:12px}
.wkrow .chip.blank{border:1px dashed var(--rule)!important}
/* Wochen-Raster */
.wgrid{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.wgrid.edit{grid-template-columns:auto repeat(7,minmax(0,1fr)) auto}
.wgrid .wh{text-align:center;font-size:11px;font-weight:700;color:var(--soft)}
.wgrid .wl{font-size:11px;font-weight:700;color:var(--soft);white-space:nowrap;padding-right:2px}
.wgrid .chip{width:100%;min-width:0;padding:0;height:28px;font-size:15px}
.wgrid.small .chip{height:20px;font-size:12px}
.wgrid .chip.blank{border:1px dashed var(--rule)!important}
.wc{border:0;background:none;padding:0}
.pick .pb{display:grid;justify-items:center;gap:2px}.pick .pb small{font-size:10.5px;font-weight:600;color:var(--soft)}
.wx{border:0;background:none;color:var(--soft);font-size:15px;padding:4px}
.wx:disabled{opacity:.25}
.tplcard{display:grid;gap:8px}
.trow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--rule)}
.trow{flex-wrap:wrap}.trow .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow input[type=time]{width:6.2em;padding:6px 4px;min-width:0}
.sheet .pan{overflow-x:hidden}
/* Komfort */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qbtn{display:grid;justify-items:center;gap:4px;border:1px solid var(--rule);background:var(--card);border-radius:12px;padding:10px 4px;font-size:12px;font-weight:600;text-align:center;box-shadow:var(--shadow)}
.qbtn .qi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--tint);font-size:18px}
.qbtn:first-child .qi,.qbtn:nth-child(2) .qi{background:var(--accent);color:var(--accent-ink)}
.btn.red{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gck{display:grid;place-items:center;width:34px;height:34px;flex:none}.gck input{width:22px;height:22px;accent-color:var(--ok)}
.gprog{color:var(--ok)!important;font-weight:700}
.hb{width:34px;height:34px;font-size:18px;flex:none}.hb:disabled{opacity:.3}
.vsbox{display:grid;gap:4px}.vsrow{display:flex;justify-content:space-between}.vsrow.tot{border-top:1px solid var(--rule);padding-top:6px;font-size:18px}
.sharebtn.wide{width:100%}
/* Einrichtung */
.onbhero{display:grid;gap:6px;text-align:left;border:2px solid var(--accent);background:var(--card);border-radius:12px;padding:14px;position:relative}
.onbhero[aria-pressed="false"]{border-color:var(--rule)}
.onbhero b{font-size:18px}.onbhero small{color:var(--soft)}
.onbtag{justify-self:start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 6px}
.onbopt.small{padding:8px 12px}
/* Stift-Modus */
.grid.paint{touch-action:pan-y}
.day.blank{visibility:hidden;border:0}
.kalnav{position:relative}.grid.dows{margin-bottom:-6px}
.mscroll{position:relative;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-bottom:8px}
.mblock{padding-bottom:6px}.mblock .grid{gap:4px}
.mlab{position:sticky;top:0;z-index:3;background:var(--paper);box-shadow:0 -6px 0 var(--paper);margin:0;padding:8px 2px 6px;font:700 17px/1.1 var(--f-display);letter-spacing:.04em;color:var(--ink)}
.vrow.hl{background:var(--free-bg);border-radius:8px;box-shadow:0 0 0 2px var(--ok)}.linkbtn.yrjump{display:block;font-weight:700;color:var(--ink);text-align:left;padding:8px 0;min-height:44px}
.vmonth{display:grid;gap:6px;margin-top:6px}.vmlab{margin:6px 0 0;font:700 17px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.vmonths .mc{border:0;font:inherit;color:inherit;cursor:pointer}.vmonths .mc.vd{background:var(--free-bg);box-shadow:inset 0 0 0 2px var(--ok)}
.kaltodayw{display:flex;justify-content:center}.kaltodayw:empty{display:none}.kaltodayw .btn{padding:5px 12px}
#rhythmbtn{justify-self:start}body.painting #rhythmbtn{display:none}#v-kal{gap:10px}
.grid.paint .day{cursor:crosshair}
.day.painted{transform:scale(.93)}
@media (prefers-reduced-motion:no-preference){ .day{transition:transform .12s} }
.day .tm{font-size:9.5px;line-height:1;color:var(--soft);font-variant-numeric:tabular-nums}
#selchips button{border:2px solid transparent;border-radius:9px;padding:2px}
#selchips button[aria-pressed="true"]{border-color:var(--paper);background:rgba(255,255,255,.14)}
#selchips .chip{height:32px;min-width:42px;font-size:17px}
.chip.rst{background:transparent;border:1px dashed rgba(255,255,255,.6);color:var(--paper)}
.selbar #selundo:disabled{opacity:.4}
body.painting .toast{bottom:calc(170px + env(safe-area-inset-bottom,0px))}

/* Unten */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;padding:9px 0 10px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--soft)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--accent)}
.fab{display:none!important;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:12px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.selbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--paper);padding:10px 16px}
.selbar .in{max-width:720px;margin:0 auto;display:grid;gap:8px}
.selbar .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.selbar .chips button{border:0;background:none;padding:0;flex:none}
.selbar .btn{background:transparent;color:var(--paper);border-color:color-mix(in srgb,var(--paper) 55%,transparent);white-space:nowrap}
.selbar .row{flex-wrap:nowrap}#selcount{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:380px){ .selbar .btn{padding:8px 9px} #selrep{font-size:0} #selrep::before{content:"↻";font-size:18px} }

/* Blatt */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .bg{position:absolute;inset:0;background:rgba(10,15,20,.45)}
.sheet .pan{position:relative;background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet .top{display:flex;align-items:center;gap:10px}
.sheet .top h2{flex:1}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:2px solid transparent;background:none;border-radius:9px;padding:2px}
.pick button[aria-pressed="true"]{border-color:var(--ink)}
.pick .chip{height:34px;min-width:48px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:9px;font-weight:600;max-width:90vw;display:flex;gap:12px;align-items:center}
.toast button{border:0;background:none;color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:no-preference){ .sheet .pan{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}} }
@media (max-width:380px){ .day{min-height:56px} .day .chip{font-size:15px} .three{grid-template-columns:1fr 1fr} }

/* Anmeldung & Einrichtung */
.auth,.onb{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding-inline:16px;padding-block:max(28px,env(safe-area-inset-top,0px)) 28px;background:var(--paper)}
.auth[hidden],.onb[hidden]{display:none}
.acard{width:100%;max-width:420px;display:grid;gap:12px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:22px 18px;box-shadow:var(--shadow)}
.acard h1{font-size:34px}
.acard form{display:grid;gap:12px}
.logo.big{width:52px;height:52px;border-radius:12px}.logo.big svg{width:28px;height:28px}
.seg.full{display:grid;grid-template-columns:1fr 1fr;width:100%}
.seg.full button{padding:10px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.amsg{font-size:14px;min-height:1.2em}.amsg.err{color:var(--bad);font-weight:600}.amsg.ok{color:var(--ok);font-weight:600}
.linkbtn{border:0;background:none;color:var(--soft);text-decoration:underline;padding:4px}
.afoot{font-size:12px;color:var(--soft);margin:0;text-align:center}.afoot a{color:var(--ink)}
.aload{display:grid;gap:10px;justify-items:center;text-align:center;color:var(--soft);padding:10px 0}
.onbsteps{display:flex;gap:6px}.onbsteps i{flex:1;height:5px;border-radius:3px;background:var(--tint)}.onbsteps i.on{background:var(--accent)}
.onblist{display:grid;gap:8px}
.onbopt{display:grid;gap:8px;text-align:left;border:2px solid var(--rule);background:var(--card);border-radius:10px;padding:10px 12px}
.onbopt[aria-pressed="true"]{border-color:var(--accent)}
.onbopt b{display:block}.onbopt small{color:var(--soft)}
.onbopt .chip{height:22px;min-width:22px;font-size:13px;padding:0 5px}
.onbchk{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.onbchk input{width:22px;height:22px;flex:none;margin-top:2px}.onbchk b{display:block}.onbchk small{color:var(--soft)}
.onbnav{margin-top:6px}
.syncline{font-size:13px;color:var(--ok)}.syncline[data-s="off"]{color:var(--warn)}.syncline[data-s="sync"]{color:var(--soft)}
.vrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--rule);background:none;padding:10px 0}
.vrow:first-of-type{border-top:0}.vrow small{display:block;color:var(--soft)}
.sharegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sharebtn{display:grid;gap:2px;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:10px}
.sharebtn b{font-size:15px}.sharebtn small{color:var(--soft);font-size:12px}
@media (max-width:380px){ .sharegrid{grid-template-columns:1fr} }
html,body{height:100%}
input[type=email],input[type=password]{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:11px 10px;width:100%;min-width:0;color:var(--ink);font-size:16px}
.bar h1{font-size:22px;white-space:nowrap}
.bar small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .grow{min-width:0}
.bar .grow{min-width:0}.bar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(15px,4.6vw,20px)}.bar .hb{flex:none;width:36px;height:36px;font-size:18px}.bar .hb:disabled{opacity:.3}#hback:not([hidden])+.logo{display:none}
</style>

<script>
/* ===================== Grundlagen ===================== */
const $=s=>document.querySelector(s);
function el(tag,cls,txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addD=(s,n)=>{ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffD=(a,b)=>Math.round((Date.UTC(...b.split("-").map((x,i)=>i===1?x-1:+x))-Date.UTC(...a.split("-").map((x,i)=>i===1?x-1:+x)))/864e5);
const TODAY=()=>iso(new Date());
const MON=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONS=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const DOW=["So","Mo","Di","Mi","Do","Fr","Sa"];
const fmt=s=>{ const d=parse(s); return DOW[d.getDay()]+", "+d.getDate()+". "+MON[d.getMonth()]+" "+d.getFullYear(); };
const fmtS=s=>{ const d=parse(s); return d.getDate()+"."+(d.getMonth()+1)+"."; };
function uid(){ return Math.random().toString(36).slice(2,9); }

/* Feiertage (alle Bundesländer) */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
const holCache={};
/* Feiertage, die nur in Teilen eines Bundeslands gelten – zum Ein-/Ausschalten */
const LOCAL_HOL={BY:[["BY_MH","Mariä Himmelfahrt (15.8.)","in Gemeinden mit überwiegend katholischer Bevölkerung",true],["BY_AUG","Augsburger Friedensfest (8.8.)","nur im Stadtgebiet Augsburg",false]],
  SN:[["SN_FL","Fronleichnam","in einigen sorbisch geprägten Gemeinden",false]], TH:[["TH_FL","Fronleichnam","in einigen Gemeinden im Eichsfeld",false]]};
const localOn=(k,def)=>S.localHol&&S.localHol[k]!=null?!!S.localHol[k]:def;
function holidays(y){
  const land=S.land, key=y+land+JSON.stringify(S.localHol||{}); if(holCache[key]) return holCache[key];
  const E=iso(easter(y)), H={};
  const add=(s,n,st)=>{ if(!st || st.includes(land)) H[s]=n; };
  add(y+"-01-01","Neujahr"); add(y+"-01-06","Hl. Drei Könige",["BW","BY","ST"]); add(y+"-03-08","Frauentag",["BE","MV"]);
  add(addD(E,-2),"Karfreitag"); add(E,"Ostersonntag",["BB"]); add(addD(E,1),"Ostermontag"); add(y+"-05-01","Tag der Arbeit");
  add(addD(E,39),"Himmelfahrt"); add(addD(E,49),"Pfingstsonntag",["BB"]); add(addD(E,50),"Pfingstmontag");
  add(addD(E,60),"Fronleichnam",["BW","BY","HE","NW","RP","SL"]); add(y+"-08-15","Mariä Himmelfahrt",["SL"]);
  if(land==="BY"&&localOn("BY_MH",true)) H[y+"-08-15"]="Mariä Himmelfahrt"; if(land==="BY"&&localOn("BY_AUG",false)) H[y+"-08-08"]="Augsburger Friedensfest";
  if((land==="SN"||land==="TH")&&localOn(land+"_FL",false)) H[addD(E,60)]="Fronleichnam"; add(y+"-09-20","Weltkindertag",["TH"]);
  add(y+"-10-03","Tag der Dt. Einheit"); add(y+"-10-31","Reformationstag",["BB","MV","SN","ST","TH","HB","HH","NI","SH"]);
  add(y+"-11-01","Allerheiligen",["BW","BY","NW","RP","SL"]);
  let bb=y+"-11-22"; while(parse(bb).getDay()!==3) bb=addD(bb,-1); add(bb,"Buß- und Bettag",["SN"]);
  add(y+"-12-25","1. Weihnachtstag"); add(y+"-12-26","2. Weihnachtstag");
  return holCache[key]=H;
}
const holName=s=>holidays(+s.slice(0,4))[s]||null;
const LAENDER=[["BW","Baden-Württemberg"],["BY","Bayern"],["BE","Berlin"],["BB","Brandenburg"],["HB","Bremen"],["HH","Hamburg"],["HE","Hessen"],["MV","Mecklenburg-Vorpommern"],["NI","Niedersachsen"],["NW","Nordrhein-Westfalen"],["RP","Rheinland-Pfalz"],["SL","Saarland"],["SN","Sachsen"],["ST","Sachsen-Anhalt"],["SH","Schleswig-Holstein"],["TH","Thüringen"]];

/* ===================== Daten ===================== */
const KINDS={work:"Arbeit",free:"Frei",vac:"Urlaub",sick:"Krank"};
const PALETTE=["#E0A100","#E8590C","#4A3FB5","#1C7C9C","#2E8B57","#C2185B","#6B7A85","#8E5A2B","#0B8A83","#7B2FA3"];
function mondayOnOrBefore(s){ let d=s; while(parse(d).getDay()!==1) d=addD(d,-1); return d; }
function defaults(){
  const t=TODAY();
  return { v:1, example:true, land:"NW", holFree:false, showFerien:true, vacPerYear:30, carry:{},
    types:[
      {id:"F",name:"Tagschicht",short:"T",color:"#1C6DD0",start:"06:00",end:"14:00",pause:30,kind:"work"},
      {id:"S",name:"Spätschicht",short:"S",color:"#E8590C",start:"14:00",end:"22:00",pause:30,kind:"work"},
      {id:"N",name:"Nachtschicht",short:"N",color:"#111111",start:"22:00",end:"06:00",pause:30,kind:"work"},
      {id:"U",name:"Urlaub",short:"U",color:"#2E8B57",start:"",end:"",pause:0,kind:"vac"},
      {id:"K",name:"Krank",short:"K",color:"#C2185B",start:"",end:"",pause:0,kind:"sick"},
      {id:"X",name:"Frei",short:"F",color:"#6B7A85",start:"",end:"",pause:0,kind:"free"}],
    rots:[{id:"r1",name:"Wechselschicht 2-2-2 / 4 frei",start:addD(mondayOnOrBefore(t),-360),pattern:["F","F","S","S","N","N",null,null,null,null]}],
    ov:{}, notes:{}, vacs:[], tpls:[] };
}
let S;
S=null;

const typeOf=id=>S.types.find(t=>t.id===id)||null;
function isDark(hex){ const h=hex.replace("#",""); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return (r*299+g*587+b*114)/1000>165; }
function isDeep(hex){ const h=String(hex||"").replace("#",""); if(h.length!==6) return false; const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return (r*299+g*587+b*114)/1000<40; }
function chip(t,extra){ const c=el("span","chip"+(extra?" "+extra:"")); if(!t||t.kind==="free"){ c.classList.add("free"); c.textContent=t?t.short:((S.types.find(x=>x.kind==="free")||{}).short||"–"); if(t) c.title=t.name; return c; } c.style.setProperty("--c",t.color); if(isDark(t.color)) c.classList.add("dark"); if(isDeep(t.color)) c.classList.add("deep"); c.textContent=t.short; c.title=t.name; return c; }
/* Welcher Rhythmus gilt an einem Tag? Vor dem ersten Rhythmus gilt dieser auch rückwärts (sonst wäre die Vergangenheit leer). */
function rotAt(s){ let best=null, first=null; for(const r of S.rots){ if(!r.pattern.length) continue; const f=r.from||r.start; if(f<=s && (!r.end || s<=r.end) && (!best || f>(best.from||best.start))) best=r; if(!first || f<(first.from||first.start)) first=r; } if(!best && first && s<(first.from||first.start)) best=first; return best; }
function baseShift(s){ const r=rotAt(s); if(!r) return null; const n=r.pattern.length, i=((diffD(r.start,s)%n)+n)%n; const id=r.pattern[i]; const t=id?typeOf(id):null;
  if(t && t.kind==="work" && S.holFree && holName(s)) return null;
  if(t && t.kind==="work" && S.weekendFree){ const w=parse(s).getDay(); if(w===0||w===6) return null; } return t; }
function cleanTypes(){ if(!S.tagMig){ S.tagMig=1; const f=S.types.find(t=>t.id==="F"&&/^Frühschicht$/i.test(t.name)); if(f){ f.name="Tagschicht"; if(f.short==="F") f.short="T"; if(/^#E0A100$/i.test(f.color)) f.color="#1C6DD0"; }
    const n=S.types.find(t=>t.id==="N"&&/^#4A3FB5$/i.test(t.color)); if(n) n.color="#111111"; const x=S.types.find(t=>t.kind==="free"&&t.short==="X"); if(x) x.short="F"; }
  const fx=S.types.find(t=>t.id==="X"&&t.name==="Frei (getauscht)"); if(fx) fx.name="Frei";
  const T=S.types.find(t=>t.id==="T"&&t.name==="Tagschicht"); if(T){ const used=(S.rots||[]).some(r=>r.pattern.includes("T"))||Object.values(S.ov).includes("T")||(S.tpls||[]).some(x=>x.weeks.flat().includes("T")); if(!used){ S.types=S.types.filter(t=>t!==T); } } }
/* Schichtart löschen – mit Nachfrage */
function deleteType(t,after){
  if(t.kind==="vac"){ toast("„Urlaub“ wird für die Urlaubsplanung gebraucht und kann nicht gelöscht werden."); return; }
  const days=Object.keys(S.ov).filter(k=>S.ov[k]===t.id).length, rots=(S.rots||[]).filter(r=>r.pattern.includes(t.id)).length, tpls=(S.tpls||[]).filter(x=>x.weeks.flat().includes(t.id)).length;
  const used=days||rots||tpls;
  const txt= used ? "„"+t.name+"“ ist noch eingetragen"+(days?" an "+days+(days===1?" Tag":" Tagen"):"")+(rots?(days?",":"")+" in "+rots+" Rotation"+(rots===1?"":"en")+" im Kalender":"")+(tpls?((days||rots)?" und":"")+" in "+tpls+" Vorlage"+(tpls===1?"":"n"):"")+".\nWenn du sie löschst, werden diese Tage frei. Bist du sicher?" : "Bist du sicher, dass du „"+t.name+"“ löschen willst?";
  ask("Schicht löschen?",txt,[{label:"Ja, löschen",pri:true,fn:()=>{ const old=JSON.parse(JSON.stringify({types:S.types,ov:S.ov,rots:S.rots,tpls:S.tpls||[]})), vb=vacSnap(), vo=JSON.parse(JSON.stringify(vacList()));
      (S.rots||[]).forEach(r=>{ r.pattern=r.pattern.map(id=>id===t.id?null:id); });
      for(const k of Object.keys(S.ov)) if(S.ov[k]===t.id){ const b=baseShift(k); if(b&&b.kind==="work") S.ov[k]=""; else delete S.ov[k]; }
      (S.tpls||[]).forEach(x=>{ x.weeks=x.weeks.map(w=>w.map(id=>id===t.id?null:id)); });
      S.types=S.types.filter(x=>x.id!==t.id); if(brush===t.id) brush=null;
      save(); if(after) after(); else { closeSheet(); render(); }
      vacCheck(vb,vo,()=>toast("„"+t.name+"“ gelöscht","Rückgängig",()=>{ Object.assign(S,old); S.vacs=vo; save(); render(); })); }},{label:"Nein",fn:()=>{}}]); }
/* Eigene Schicht ohne Urlaub */
function ownShift(s){ if(Object.prototype.hasOwnProperty.call(S.ov,s)){ const o=S.ov[s]; const t=o?typeOf(o):null; if(!t || t.kind!=="vac") return t; } return baseShift(s); }
/* Urlaub = Zeiträume; gezählt wird an Tagen, an denen man laut Schichtplan arbeiten würde */
function vacList(){ if(!Array.isArray(S.vacs)) S.vacs=[]; return S.vacs; }
function vacAt(s){ return vacList().find(v=>v.a<=s && s<=v.e)||null; }
function vacOnDay(v,s){ const own=ownShift(s); if(own && own.kind==="sick") return false; return v.fixed ? v.fixed.includes(s) : !!(own && own.kind==="work"); }
function vacDaysOf(v){ const out=[]; for(let s=v.a;s<=v.e;s=addD(s,1)) if(vacOnDay(v,s)) out.push(s); return out; }
function shiftOf(s){ const v=vacAt(s); if(v && vacOnDay(v,s)) return vacType()||ownShift(s); return ownShift(s); }
function normVacs(){ const L=vacList().filter(v=>v.a<=v.e).sort((x,y)=>x.a<y.a?-1:1), out=[];
  for(const v of L){ const l=out[out.length-1]; if(l && addD(l.e,1)>=v.a && !l.fixed && !v.fixed){ if(v.e>l.e) l.e=v.e; } else out.push(v); } S.vacs=out; }
function addVac(a,e){ vacList().push({id:uid(),a,e}); normVacs(); }
/* Einzelnen Urlaubstag setzen (Tagesfenster, Malen): ohne Schichtplan zählt ein Werktag (Mo–Fr, kein Feiertag) wie im Eintragen-Fenster */
function addVacDay(s){ if(vacAt(s)) return; if(!planKnown(s) && ![0,6].includes(parse(s).getDay()) && !holName(s)){ vacList().push({id:uid(),a:s,e:s,fixed:[s]}); normVacs(); } else addVac(s,s); }
function removeVacDay(s){ const v=vacAt(s); if(!v) return; if(v.fixed) v.fixed=v.fixed.filter(x=>x!==s);
  if(v.a===v.e){ S.vacs=S.vacs.filter(x=>x!==v); return; } if(s===v.a){ v.a=addD(s,1); return; } if(s===v.e){ v.e=addD(s,-1); return; }
  const n={id:uid(),a:addD(s,1),e:v.e}; if(v.fixed){ n.fixed=v.fixed.filter(x=>x>s); v.fixed=v.fixed.filter(x=>x<s); } v.e=addD(s,-1); S.vacs.push(n); normVacs(); }
function migrateVac(){ vacList(); const vt=S.types.filter(t=>t.kind==="vac").map(t=>t.id); const days=Object.keys(S.ov).filter(k=>vt.includes(S.ov[k])).sort(); if(!days.length) return;
  days.forEach(k=>delete S.ov[k]); let cur=null;
  days.forEach(d=>{ if(cur){ let join=true; for(let k=addD(cur.e,1);k<d;k=addD(k,1)){ const t=ownShift(k); if(t&&t.kind==="work"){ join=false; break; } } if(join){ cur.e=d; return; } } cur={id:uid(),a:d,e:d}; S.vacs.push(cur); }); normVacs(); }
function vacSnap(){ const m={}; vacList().forEach(v=>m[v.id]=vacDaysOf(v)); return m; }
/* Fragt nach, wenn eine Änderung am Schichtplan deinen Urlaub verändert */
function vacCheck(before,oldVacs,done){
  const diffs=[]; vacList().forEach(v=>{ const b0=before[v.id]; if(!b0) return; const b=b0.filter(d=>d>=v.a&&d<=v.e); const now=vacDaysOf(v); if(b.join()!==now.join()) diffs.push({v,b,now}); });
  if(!diffs.length){ done&&done(); return; }
  const txt=diffs.map(d=>"Urlaub "+fmtS(d.v.a)+"–"+fmtS(d.v.e)+": "+d.b.length+" → "+d.now.length+" Urlaubstage").join("\n");
  ask("Urlaub anpassen?","Deine Änderung am Schichtplan betrifft deinen Urlaub:\n"+txt+"\nSoll die Änderung auf deinen Urlaub übertragen werden?",[
    {label:"Ja, übertragen",pri:true,fn:()=>{ save(); render(); toastWith("Urlaub angepasst",done); }},
    {label:"Nein, Urlaubstage behalten",fn:()=>{ diffs.forEach(d=>{ d.v.fixed=d.b.slice(); }); save(); render(); toastWith("Urlaubstage bleiben wie bisher",done); }}]); }
/* Meldung zeigen, ohne eine folgende Meldung mit „Rückgängig“ zu verdecken: beide Texte werden verbunden */
var toastPre=""; function toastWith(msg,done){ toastPre=msg; done&&done(); if(toastPre){ toastPre=""; toast(msg); } }
function ask(title,text,btns){ let a=$("#ask"); if(!a){ a=el("div","ask"); a.id="ask"; document.body.append(a); }
  a.innerHTML=""; const c=el("div","askc"); c.setAttribute("role","alertdialog"); c.append(el("h2",null,title)); text.split("\n").forEach((l,i)=>c.append(el("p",i?"askline":null,l)));
  const r=el("div","askb"); btns.forEach(b=>{ const x=el("button","btn"+(b.pri?" pri":""),b.label); x.type="button"; x.onclick=()=>{ a.hidden=true; b.fn&&b.fn(); }; r.append(x); }); c.append(r); a.append(c); a.hidden=false; }
function minutes(t){ if(!t || t.kind!=="work" || !t.start || !t.end) return 0; const [a,b]=t.start.split(":").map(Number), [c,d]=t.end.split(":").map(Number); let m=(c*60+d)-(a*60+b); if(m<=0) m+=1440; return Math.max(0,m-(+t.pause||0)); }
const hStr=m=>{ const h=Math.floor(m/60), mm=m%60; return h+(mm?":"+pad(mm):"")+" h"; };

/* Urlaub */
function vacUsed(y){ let n=0; for(let s=y+"-01-01"; s<=y+"-12-31"; s=addD(s,1)){ const t=shiftOf(s); if(t && t.kind==="vac") n++; } return n; }
function carryOf(y){ if(S.carryAuto&&S.carryAuto[y]) return Math.max(0,Math.min(99,vacTotal(y-1)-vacUsed(y-1))); return +(S.carry[y]||0); }
/* Verfall von Resturlaub: Stichtag (Standard 31.3.), Urlaub im neuen Jahr wird zuerst vom Rest abgezogen */
function expCfg(){ const e=S.expire||{}; return {on:e.on!==false, md:/^\d\d-\d\d$/.test(e.md||"")?e.md:"03-31"}; }
function expInfo(y,co){ const c=expCfg(); if(!c.on) return null; const carry=co!=null?co:carryOf(y); if(carry<=0) return null; const date=y+"-"+c.md; let u=0;
  for(let s=y+"-01-01"; s<=date; s=addD(s,1)){ const t=shiftOf(s); if(t&&t.kind==="vac") u++; } const left=Math.max(0,carry-u); return {carry,date,used:Math.min(carry,u),left,passed:TODAY()>date}; }
function vacTotal(y){ const x=expInfo(y); return (+S.vacPerYear||0)+carryOf(y)+((S.vacCorr&&+S.vacCorr[y])||0)-(x&&x.passed?x.left:0); }
/* Hinweis „X Tage aus Vorjahr verfallen am …“ (nur solange noch etwas zu retten ist) */
function expWarn(y){ const x=expInfo(y); if(!x||x.passed||!x.left) return null; return x; }
function expBanner(y,id){ const x=expWarn(y); if(!x) return null; const b=el("div","banner exp"); b.id=id; const t=el("span","grow"); t.style.flexBasis="100%";
  t.innerHTML="<b>"+x.left+(x.left===1?" Tag":" Tage")+" aus "+(y-1)+" verfallen am "+fmtS(x.date)+"</b> – plane sie vorher ein ("+(diffD(TODAY(),x.date))+" Tage Zeit).";

/* ---------- Monate untereinander (durchgehend scrollbar wie ein Handy-Kalender) ----------
   Die Monate liegen in einem eigenen Scroll-Bereich (#mscroll). Oben steht immer der Monat, der gerade sichtbar ist.
   Am Anfang/Ende werden je 3 Monate nachgeladen; höchstens KAL_MAX Monate gleichzeitig (für Tempo). */
const KAL_MAX=15, KAL_STEP=3; const KAL={a:null,e:null,top:null,off:0,busy:false};
const ymOf=(y,m)=>y*12+m, ymY=v=>Math.floor(v/12), ymM=v=>((v%12)+12)%12;
/* Tage aus dem Vor-/Folgemonat zum Auffüllen der ersten/letzten Woche */
function padBefore(first){ const n=(parse(first).getDay()+6)%7, out=[]; for(let i=n;i>0;i--) out.push(addD(first,-i)); return out; }
function padAfter(last){ const n=(7-((parse(last).getDay()+6)%7)-1), out=[]; for(let i=1;i<=n;i++) out.push(addD(last,i)); return out; }
function lastOfMonth(first){ const d=parse(first); return iso(new Date(d.getFullYear(),d.getMonth()+1,0)); }
function miniCell(d,cls,onTap){ const c=el(onTap?"button":"span","mc"+(cls?" "+cls:"")); if(onTap){ c.type="button"; c.onclick=()=>{ if(c.closest(".swiped")) return; onTap(d); }; } c.dataset.s=d; c.append(el("i",null,String(parse(d).getDate()))); c.append(vacChip(d,shiftOf(d)));
  if(dayKind(d)==="v") c.classList.add("vd"); if(holName(d)) c.classList.add("hol"); if(d===TODAY() && !(cls&&/out/.test(cls))) c.classList.add("first");
  c.setAttribute("aria-label",fmt(d)+(holName(d)?", "+holName(d):"")+(dayKind(d)==="v"?", Urlaub":"")+(cls&&/out/.test(cls)?" (anderer Monat)":"")); return c; }
/* Ein Monat als kleines Raster – mit den Tagen vom Vor- und Folgemonat (blasser) */
function monthMini(y,m,onTap){ const g=el("div","mcal"); WDS.forEach(d=>g.append(el("span","dw",d))); const f=y+"-"+pad(m+1)+"-01";
  padBefore(f).forEach(d=>g.append(miniCell(d,"out",onTap))); for(let d=f; +d.slice(5,7)===m+1; d=addD(d,1)) g.append(miniCell(d,null,onTap)); padAfter(lastOfMonth(f)).forEach(d=>g.append(miniCell(d,"out",onTap))); return g; }

/* Hoch/runter (oder seitlich) wischen blättert den Monat. step(+1) = nächster Monat */
function swipeMonths(elm,step){ elm.classList.add("swipem"); let x0=null,y0=0;
  elm.addEventListener("pointerdown",e=>{ if(e.pointerType==="mouse"&&e.button!==0) return; x0=e.clientX; y0=e.clientY; },{passive:true});
  const fin=e=>{ if(x0==null) return; const dx=e.clientX-x0, dy=e.clientY-y0; x0=null; const ax=Math.abs(dx), ay=Math.abs(dy); if(Math.max(ax,ay)<40) return;
    elm.classList.add("swiped"); setTimeout(()=>elm.classList.remove("swiped"),60); step(ay>=ax?(dy<0?1:-1):(dx<0?1:-1)); };
  elm.addEventListener("pointerup",fin); elm.addEventListener("pointercancel",()=>{ x0=null; }); }
function monthBlock(v){ const y=ymY(v), m=ymM(v), blk=el("section","mblock"); blk.dataset.ym=String(v); blk.id="mb-"+y+"-"+pad(m+1);
  blk.append(el("h3","mlab",MON[m]+" "+y)); const g=el("div","grid"); if(selMode) g.classList.add("paint");
  const first=y+"-"+pad(m+1)+"-01", t=TODAY();
  const cell=(s,out)=>{ const d=parse(s), c=el("button","day"); c.type="button"; c.dataset.s=s; if(d.getDay()===0||d.getDay()===6) c.classList.add("we"); if(s===t&&!out) c.classList.add("now"); if(holName(s)) c.classList.add("hol"); fillCell(c,s); if(out){ c.classList.add("out"); c.dataset.out="1"; } g.append(c); };
  padBefore(first).forEach(s=>cell(s,true));
  for(let s=first; +s.slice(5,7)===m+1; s=addD(s,1)) cell(s,false);
  padAfter(lastOfMonth(first)).forEach(s=>cell(s,true));
  blk.append(g); return blk; }

function makeICS(){
  const out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Schicht und Urlaub//DE","CALSCALE:GREGORIAN"]; const t=TODAY(); const st=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  for(let i=0;i<365;i++){ const s=addD(t,i), x=shiftOf(s); if(!x || x.kind==="free") continue; const ds=s.replace(/-/g,"");
    out.push("BEGIN:VEVENT","UID:"+ds+"-"+x.id+"@schicht-urlaub","DTSTAMP:"+st);
    if(x.kind==="work" && x.start){ const e=x.end<=x.start?addD(s,1):s; out.push("DTSTART:"+ds+"T"+x.start.replace(":","")+"00","DTEND:"+e.replace(/-/g,"")+"T"+x.end.replace(":","")+"00"); }
    else out.push("DTSTART;VALUE=DATE:"+ds,"DTEND;VALUE=DATE:"+addD(s,1).replace(/-/g,""));
    out.push("SUMMARY:"+String(x.name).replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n"));
    if(x.kind==="work" && x.start && +S.remind>0) out.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+String(x.name).replace(/[\\;,]/g,m=>"\\"+m)+" um "+x.start+" Uhr","TRIGGER:-PT"+(+S.remind)+"M","END:VALARM");
    out.push("END:VEVENT"); }
  out.push("END:VCALENDAR"); return out.join("\r\n");
}

function payCfg(){ const p=S.pay||{}; return {rate:+p.rate||0, night:p.night==null?25:+p.night, sun:p.sun==null?50:+p.sun, hol:p.hol==null?125:+p.hol}; }
/* Minuten einer Schicht aufteilen: gesamt, Nacht (20–6 Uhr), Sonntag, Feiertag – Pause anteilig abgezogen */
function shiftSplit(s,x){ const r={min:0,night:0,sun:0,hol:0}; if(!x||x.kind!=="work"||!x.start||!x.end) return r;
  const [a,b]=x.start.split(":").map(Number), [c,d]=x.end.split(":").map(Number); let len=(c*60+d)-(a*60+b); if(len<=0) len+=1440; let paid=Math.max(0,len-(+x.pause||0)), f=len?paid/len:0;
  let n=0,su=0,ho=0; const s2=addD(s,1), sunA=parse(s).getDay()===0, sunB=parse(s2).getDay()===0, holA=!!holName(s), holB=!!holName(s2);
  for(let m=a*60+b, i=0; i<len; i++, m++){ const nextDay=m>=1440, mm=m%1440, h=Math.floor(mm/60); if(h>=20||h<6) n++; const isH=nextDay?holB:holA; if(isH) ho++; else if(nextDay?sunB:sunA) su++; }

  const D0=parse(s), t0=new Date(D0.getFullYear(),D0.getMonth(),D0.getDate(),a,b), t1=new Date(D0.getFullYear(),D0.getMonth(),D0.getDate()+((c*60+d)<=(a*60+b)?1:0),c,d), real=Math.round((t1-t0)/60000), dl=real-len;
  if(dl && Math.abs(dl)<=60){ len=real; paid=Math.max(0,len-(+x.pause||0)); f=len?paid/len:0; n=Math.max(0,n+dl); const dstDay=a*60+b<120&&(c*60+d)>(a*60+b)?s:s2; if(holName(dstDay)) ho=Math.max(0,ho+dl); else if(parse(dstDay).getDay()===0) su=Math.max(0,su+dl); }

function rangeWork(a,e){ const o={min:0,night:0,sun:0,hol:0,vac:0,sick:0,shifts:0,we:0,hd:0,cnt:new Map()}; for(let s=a; s<=e; s=addD(s,1)){ const x=shiftOf(s); const k=x?x.id:"-"; o.cnt.set(k,(o.cnt.get(k)||0)+1); if(!x) continue;

function creditMin(o){ if(+S.soll>0) return Math.round(+S.soll*60/5); if(o.shifts) return Math.round(o.min/o.shifts);
  const ids=(S.rots||[]).flatMap(r=>r.pattern).filter(Boolean), L=(ids.length?ids:S.types.map(t=>t.id)).map(typeOf).filter(t=>t&&t.kind==="work"&&minutes(t)>0); return L.length?Math.round(L.reduce((a,t)=>a+minutes(t),0)/L.length):0; }

/* ===================== Team (gemeinsam mit dem Team-Urlaubsplaner, gleiche Firebase-Daten) ===================== */
const FSB=()=>"https://firestore.googleapis.com/v1/projects/"+CFG.projectId+"/databases/(default)/documents";
const tKey=n=>String(n||"").trim().toLowerCase();
function tSynthMail(name){ const s=tKey(name.replace(/\s+/g," ")).replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,".").replace(/^\.+|\.+$/g,"").slice(0,50); return (s||"nutzer")+"@ohne-mail.example.com"; }
async function tEmailHash(e){ const t=e.trim().toLowerCase(); try{ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("zfp-urlaub:"+t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(_){ let h=5381; for(const c of t) h=((h*33)^c.charCodeAt(0))>>>0; return "f"+h.toString(16); } }
function tEmailMask(e){ const [u,d]=e.trim().toLowerCase().split("@"); return (u.length<=2?u[0]:u.slice(0,2))+"***@"+d; }
let ts=null; try{ ts=JSON.parse(lsGet("su_team")||"null"); }catch(e){ ts=null; }
const team={loaded:false,loading:false,err:null,members:[],vac:[],me:null,limit:2,mode:"login",msg:""};
try{ const c=JSON.parse(lsGet("su_team_cache")||"null"); if(c && ts && c.uid===ts.uid){ Object.assign(team,{members:c.members||[],vac:c.vac||[],me:c.me||null,limit:c.limit||2,loaded:true}); } }catch(e){}
function tsSet(j,email){ ts={uid:j.localId||j.user_id||(ts&&ts.uid), email:(email||j.email||(ts&&ts.email)||"").toLowerCase(), idToken:j.idToken||j.id_token, refreshToken:j.refreshToken||j.refresh_token, exp:Date.now()+((+(j.expiresIn||j.expires_in)||3600)-120)*1000}; lsSet("su_team",JSON.stringify(ts)); }
async function tToken(){ if(!ts) throw Object.assign(new Error("NO_SESSION"),{code:"NO_SESSION"}); if(Date.now()<ts.exp && ts.idToken) return ts.idToken;
  let r; try{ r=await fetch("https://securetoken.googleapis.com/v1/token?key="+CFG.apiKey,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(ts.refreshToken)}); }catch(e){ throw Object.assign(new Error("NETWORK"),{code:"NETWORK"}); }
  const j=await r.json().catch(()=>({})); if(!r.ok){ const m=(j.error&&j.error.message)||"HTTP_"+r.status; throw Object.assign(new Error(m),{code:m}); } tsSet(j,ts.email); return ts.idToken; }
function fsVal(v){ if(!v) return null; if("stringValue" in v) return v.stringValue; if("integerValue" in v) return +v.integerValue; if("doubleValue" in v) return v.doubleValue; if("booleanValue" in v) return v.booleanValue; return null; }
function fsDoc(d){ const o={id:d.name.split("/").pop()}; for(const k in (d.fields||{})) o[k]=fsVal(d.fields[k]); return o; }
function fsFields(o){ const f={}; for(const k in o){ const v=o[k]; f[k]=v==null?{nullValue:null}:typeof v==="boolean"?{booleanValue:v}:typeof v==="number"?{integerValue:String(Math.round(v))}:{stringValue:String(v)}; } return {fields:f}; }
async function fsReq(path,method,body){ let r; try{ r=await fetch(FSB()+path,{method:method||"GET",headers:Object.assign({Authorization:"Bearer "+await tToken()},body?{"Content-Type":"application/json"}:{}),body:body?JSON.stringify(body):undefined}); }catch(e){ if(e.code) throw e; throw Object.assign(new Error("NETWORK"),{code:"NETWORK"}); }
  const j=await r.json().catch(()=>({})); if(!r.ok){ const m=(j.error&&j.error.status)||"HTTP_"+r.status; throw Object.assign(new Error(m),{code:m}); } return j; }
async function fsList(col){ const out=[]; let pt=""; do{ const j=await fsReq("/"+col+"?pageSize=300"+(pt?"&pageToken="+encodeURIComponent(pt):"")); (j.documents||[]).forEach(d=>out.push(fsDoc(d))); pt=j.nextPageToken||""; }while(pt); return out; }
const isTeamAdmin=()=>!!(ts && CFG.adminEmail && ts.email===String(CFG.adminEmail).toLowerCase());
const teamOn=()=>!!(ts && team.me && (team.me.approved || isTeamAdmin()));
function tErr(e){ const c=String((e&&(e.code||e.message))||"");
  if(/NETWORK|Failed to fetch/.test(c)) return "Keine Internetverbindung.";
  if(/PERMISSION_DENIED/.test(c)) return "Dafür fehlt die Freigabe.";
  return authMsg(e); }
async function teamLoad(){ if(!ts || team.loading) return; team.loading=true; team.err=null; if(view==="team") renderTeam();

    team.members=mem; team.me=mem.find(a=>a.id===ts.uid)||mem.find(a=>a.uid===ts.uid)||null;
    const lim=mem.find(a=>Number.isFinite(a.maxWeg)); team.limit=lim?Math.max(1,Math.min(7,Math.round(lim.maxWeg))):2;
    team.vac= teamOn() ? (await fsList("urlaube")).filter(v=>typeof v.name==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v.start||"")&&/^\d{4}-\d{2}-\d{2}$/.test(v.end||"")&&v.start<=v.end) : [];
    team.loaded=true; lsSet("su_team_cache",JSON.stringify({uid:ts.uid,members:team.members,vac:team.vac,me:team.me,limit:team.limit}));
  }catch(e){ team.err=tErr(e); const c=String(e.code||""); if(/TOKEN|REFRESH|USER_NOT_FOUND|USER_DISABLED|NO_SESSION/.test(c)){ teamLogout(true); team.msg="Bitte melde dich neu an."; } }

function teamLogout(silent){ ts=null; lsSet("su_team",null); lsSet("su_team_cache",null); Object.assign(team,{loaded:false,members:[],vac:[],me:null,err:null,mode:"login"}); if(!silent) renderTeam(); }
/* Wer ist an welchem Tag weg (ohne mich) */
function teamAway(withMe){ const m=new Map(), me=team.me?tKey(team.me.name):null;
  for(const v of team.vac){ const k=tKey(v.name); if(!withMe && k===me) continue; for(let s=v.start;s<=v.end;s=addD(s,1)){ let st=m.get(s); if(!st) m.set(s,st=new Set()); if(!st.has(k)) st.add(k); } } return m; }
function teamNames(set){ const by=new Map(team.members.map(a=>[tKey(a.name),a.name])); return [...set].map(k=>by.get(k)||k); }
/* Zeiträume, in denen zu viele gleichzeitig weg sind */
function teamClashes(from,days){ const m=teamAway(true), out=[]; let cur=null;
  for(let i=0;i<days;i++){ const s=addD(from,i), st=m.get(s), n=st?st.size:0;
    if(n>team.limit){ const who=[...st].sort().join("|"); if(cur && cur.who===who && cur.e===addD(s,-1)){ cur.e=s; } else { cur={a:s,e:s,n,who,names:teamNames(st)}; out.push(cur); } } else cur=null; }
  return out; }
/* Mein Urlaub: was fehlt im Team, was gibt es nur im Team */
function teamDiff(){ if(!team.me) return {missing:[],extra:[]}; const me=tKey(team.me.name), mine=team.vac.filter(v=>tKey(v.name)===me), loc=vacList().filter(v=>v.e>=TODAY());
  const missing=loc.filter(v=>!mine.some(t=>t.start===v.a&&t.end===v.e));
  const extra=mine.filter(t=>t.end>=TODAY() && !vacList().some(v=>!(v.e<t.start||v.a>t.end)));
  return {missing,extra,mine}; }
async function teamPush(list){ const me=team.me; if(!me) return 0; const mine=team.vac.filter(v=>tKey(v.name)===tKey(me.name)); let n=0;
  for(const v of list){ for(const t of mine.filter(t=>!(t.end<v.a||t.start>v.e))){ await fsReq("/urlaube/"+t.id,"DELETE"); }
    await fsReq("/urlaube","POST",fsFields({name:me.name,start:v.a,end:v.e,created:Date.now()})); n++; }
  return n; }
/* Nach dem Eintragen fragen, ob es ins Team soll */
function teamOffer(then){ const nx=()=>{ if(then) setTimeout(then,250); }; if(!teamOn()) return nx(); const d=teamDiff(); if(!d.missing.length) return nx();
  const cl=d.missing.map(v=>{ const m=teamAway(false); let worst=0; for(let s=v.a;s<=v.e;s=addD(s,1)){ const n=(m.get(s)||new Set()).size+1; if(n>worst) worst=n; } return worst; }), over=Math.max(...cl)>team.limit;
  ask("Ans Team senden?",(over?"Achtung: Dann wären bis zu "+Math.max(...cl)+" gleichzeitig weg (erlaubt: "+team.limit+").\n":"")+"Soll dein Urlaub auch im Team erscheinen?",[
    {label:"Ja, ans Team senden",pri:true,fn:async()=>{ try{ const n=await teamPush(d.missing); toast(n+(n===1?" Urlaub":" Urlaube")+" ans Team gesendet"); teamLoad(); }catch(e){ toast(tErr(e)); } nx(); }},
    {label:"Später",fn:nx}]); }

async function boot(){
  if(CFG.localMode){ sess=null;
    /* Daten aus einer früheren Anmeldung auf diesem Gerät übernehmen */
    if(!lsGet(dataKey())){ try{ let best=null; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!/^su_data_.+$/.test(k) || /_dirty$/.test(k)) continue; const d=JSON.parse(localStorage.getItem(k)); if(validData(d) && (!best || (d.updated||0)>(best.updated||0))) best=d; } if(best) lsSet(dataKey(),JSON.stringify(best)); }catch(e){} }
    S=load(); if(!S || !S.onboarded){ S=S||defaults(); openOnboarding(); return; } enterApp(); return; }
  if(!CFG.apiKey || !CFG.projectId || /HIER_/.test(CFG.apiKey+CFG.projectId)){ authLoading("Die App ist noch nicht eingerichtet (config.js)."); return; }
  try{ sess=JSON.parse(lsGet("su_sess")||"null"); }catch(e){ sess=null; }
  if(!sess || !sess.uid){ sess=null; showAuth("login"); return; }
  S=load();
  if(!S){ authLoading("Lade deine Daten …");
    try{ const r=await cloudGet(); if(r && r.data){ const d=JSON.parse(r.data); if(validData(d)){ S=d; lsSet(dataKey(),r.data); } } }
    catch(e){ const c=String(e.code||e.message);
      if(/NETWORK|Failed to fetch/.test(c)){ $("#aloadt").textContent="Keine Internetverbindung. Beim ersten Anmelden auf einem Gerät brauche ich Internet."; $("#aretry").hidden=false; return; }
      if(/TOKEN|REFRESH|USER_NOT_FOUND|USER_DISABLED|PERMISSION|UNAUTH/.test(c)){ lsSet("su_sess",null); sess=null; showAuth("login","Bitte melde dich neu an."); return; } } }
  if(!S || !S.onboarded){ S=S||defaults(); openOnboarding(); return; }
  enterApp(); pull();
}

function b64(bytes){ let s=""; const u=bytes instanceof Uint8Array?bytes:new TextEncoder().encode(String(bytes)); for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
async function shareFile(bytes,fname,mime,title){
  const C=window.Capacitor, P=C&&C.Plugins;
  if(C && C.isNativePlatform && C.isNativePlatform() && P && P.Filesystem && P.Share){
    try{ const w=await P.Filesystem.writeFile({path:fname,data:b64(bytes),directory:"CACHE"}); await P.Share.share({title,text:title,files:[w.uri],dialogTitle:"Teilen"}); return; }
    catch(e){ if(/cancel/i.test(String(e&&e.message))) return; toast("Teilen hat nicht geklappt."); return; } }
  try{ const d=window.claude&&window.claude.use?await window.claude.use("downloads"):null; if(d){ try{ await d.save({filename:fname,data:new Blob([bytes],{type:mime})}); toast("Gespeichert im Ordner „Downloads“"); }catch(e){ if(!e||e.code!=="declined") toast("Speichern hat nicht geklappt."); } return; } }catch(e){}
  const file=new File([bytes],fname,{type:mime});
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  const url=URL.createObjectURL(file); const a=document.createElement("a"); a.href=url; a.download=fname; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); toast("Gespeichert im Ordner „Downloads“"); }
