# Spielt firestore.rules automatisch in Firebase ein, sobald sie sich auf main ändern.
# Braucht das GitHub-Secret FIREBASE_SERVICE_ACCOUNT (Inhalt der Dienstkonto-JSON-Datei aus Firebase).
name: Firestore-Regeln veröffentlichen

on:
  push:
    branches: [main, claude/schicht-urlaub-app-r315ii]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Schlüssel bereitstellen
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT fehlt"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          # Prüft das Format, ohne geheime Werte auszugeben
          node -e '
            let j; try { j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); }
            catch (e) { console.log("::error::Secret ist kein gültiges JSON (ganze Datei kopiert?)"); process.exit(1); }
            const miss = ["type","project_id","private_key","client_email"].filter(k => !j[k]);
            console.log("type:", j.type, "| project_id:", j.project_id, "| fehlende Felder:", miss.join(",") || "keine");
            if (j.type !== "service_account" || miss.length) process.exit(1);
            if (j.project_id !== "urlaubsplanung-team-zfp") { console.log("::error::Schlüssel gehört zu einem anderen Projekt"); process.exit(1); }
          ' "$RUNNER_TEMP/sa.json"
      - name: Regeln veröffentlichen
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project urlaubsplanung-team-zfp --non-interactive
      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
