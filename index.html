<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schicht &amp; Urlaub</title>
<meta name="theme-color" content="#D9480F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schicht">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Figtree:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}</style>
<script src="config.js"></script>
<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: ein Schichtbuch in der Hosentasche – oben "Heute", darunter Monatsraster wie ein Dienstplan-Aushang, Tabs unten */
:root{
  --paper:#F2F4F3; --card:#FFFFFF; --ink:#16222B; --soft:#5B6873; --rule:#D5DBDE; --tint:#E7ECEE;
  --accent:#D9480F; --accent-ink:#FFFFFF; --focus:#1C6DD0; --ok:#2E8B57; --warn:#B7791F; --bad:#C0392B;
  --hol:#9A6A00; --hol-bg:#FFF1CC; --free-bg:#CFEBD6; --free-ink:#17663A; --free-bd:#A9D8B6; --fer:#7B4FC4;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(22,34,43,.07),0 4px 14px rgba(22,34,43,.05);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0F1519; --card:#172027; --ink:#E6ECEF; --soft:#94A2AC; --rule:#2A3740; --tint:#1E2A32;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --focus:#6FA8FF; --ok:#5CC98A; --warn:#E8B04B; --bad:#FF7B6E;
  --hol:#F2C14E; --hol-bg:#3A2E0E; --free-bg:#1C3B28; --free-ink:#93DBAA; --free-bd:#2D5C3F; --fer:#B99AF0; --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F1519; --card:#172027; --ink:#E6ECEF; --soft:#94A2AC; --rule:#2A3740; --tint:#1E2A32;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --focus:#6FA8FF; --ok:#5CC98A; --warn:#E8B04B; --bad:#FF7B6E;
  --hol:#F2C14E; --hol-bg:#3A2E0E; --free-bg:#1C3B28; --free-ink:#93DBAA; --free-bd:#2D5C3F; --fer:#B99AF0; --shadow:none; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:7px;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
h1{font:700 26px/1 var(--f-display);letter-spacing:.01em;margin:0;text-transform:uppercase}
.bar small{display:block;color:var(--soft);font-size:12px;margin-top:2px}
h2{font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font:600 13px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin:0 0 8px}
.sec{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px;box-shadow:var(--shadow);min-width:0}
.muted{color:var(--soft)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:9px 13px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:1px solid var(--rule);background:var(--card);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;font-size:18px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--soft);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:9px 10px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:90px;resize:vertical;font-family:var(--f-mono);font-size:12px}
.banner{border:1px dashed var(--warn);color:var(--ink);background:transparent;border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--warn)}

/* Schicht-Plakette */
.chip{--c:#888;display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 8px;border-radius:6px;background:var(--c);color:#fff;font:700 15px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.chip.free{background:var(--free-bg);color:var(--free-ink);border:1px solid var(--free-bd)}
.chip.dark{color:#16222B}
.chip.deep{box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}

/* Heute */
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.today .big{width:84px;height:84px;border-radius:12px;display:grid;place-items:center;font:700 44px/1 var(--f-display);color:#fff}
.today .big.free{background:var(--free-bg);color:var(--free-ink);border:1px solid var(--free-bd)}
.today .big.dark{color:#16222B}
.today .t1{font:700 30px/1 var(--f-display);text-transform:uppercase}
.today .live{font-weight:700;font-size:14px;margin-top:4px;color:var(--soft)}.today .live.run{color:var(--ok)}
.stat b{white-space:nowrap}.stats3 .stat{min-width:0}.stats3 .stat b{font-size:clamp(17px,5.2vw,30px)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week button{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:6px 2px;display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--soft)}
.week button.now{border-color:var(--ink)}
.week .chip{min-width:0;width:100%;max-width:40px;height:24px;font-size:14px;padding:0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat b{display:block;font:700 30px/1 var(--f-display)}
.stat span{font-size:12px;color:var(--soft)}
.meter{height:8px;border-radius:4px;background:var(--tint);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--ok)}

/* Monat */
.mhead{display:flex;align-items:center;gap:8px}
.mhead h2{flex:1;text-align:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 14px;font-weight:600;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font:600 12px var(--f-body);color:var(--soft);text-transform:uppercase;letter-spacing:.06em;padding:2px 0}
.day{position:relative;border:1px solid var(--rule);background:var(--card);border-radius:8px;min-height:64px;padding:4px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.day.out{opacity:.38;filter:saturate(.35)}
.day.out .dn{font-weight:500}
.day.out.now{border-color:var(--rule)}
.day.we .dn{color:var(--soft)}
.day.now{border:2px solid var(--ink)}
.day.hol{background:var(--hol-bg)}
.day.fday,.week button.fday{background:var(--free-bg);border-color:var(--free-bd)}
.day.fday .dn,.week button.fday{color:var(--free-ink)}
.day.fday .chip,.week button.fday .chip{background:transparent;border:0;color:var(--free-ink)}
.day.vday,.week button.vday{background:var(--vbg,#2E8B57);border-color:var(--vbg,#2E8B57);color:#fff}
.day.vday .dn,.day.vday .tm,.day.vday .hn{color:#fff}
.day.vday .chip,.week button.vday .chip{background:transparent!important;border:0!important;color:#fff}
.day.vday .chip.invac,.week button.vday .chip.invac{background:var(--c)!important;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.85);opacity:.95}
.day.vday .chip.invac.dark,.week button.vday .chip.invac.dark{color:#16222B}
.day .vtm{font-weight:700;color:#fff!important}
.day.vday .fer{background:#fff}
.day.fday.now,.day.vday.now{border:2px solid var(--ink)}
.day.sel{outline:3px solid var(--focus);outline-offset:-2px}
.dn{font:600 13px/1 var(--f-body);font-variant-numeric:tabular-nums}
.day .chip{min-width:0;width:100%;height:auto;flex:1;min-height:30px;font-size:17px;padding:0 2px}
.day .ovr{position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.day .both{position:absolute;top:1px;right:3px;font-style:normal;font-size:11px;line-height:1;color:var(--bad)}
.day .nt{position:absolute;top:3px;left:4px;width:6px;height:6px;border-radius:1px;background:var(--focus)}
.day .swp{position:absolute;top:1px;left:3px;font-style:normal;font-size:11px;line-height:1;font-weight:800;color:var(--focus)}.day.vday .swp{color:#fff}
.day .nt+.swp{left:12px}
.day .hn{font-size:9px;line-height:1.1;color:var(--hol);font-weight:700;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--soft)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .chip{height:20px;min-width:26px;font-size:13px}
.hint{font-size:13px;color:var(--soft)}
/* Jahresplaner */
.yplan{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px));gap:6px}
.yplan[hidden]{display:none}
.yptop{display:flex;align-items:center;gap:6px}.yptop h2{font-size:18px;text-align:center}
.yphint{margin:0;font-size:13px;color:var(--soft);text-align:center}
.ypgrid{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(0,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.yph{background:var(--ink);color:var(--paper);font:700 12px/1.9 var(--f-body);text-align:center;text-transform:uppercase}
.ypc{background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:2px;padding:0 3px;font:600 11px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink);min-width:0;overflow:hidden;position:relative}
.ypc.none{background:var(--tint)}
.ypc.sa{background:#FBEBC8}.ypc.so{background:#F2C79B;font-weight:800}
.ypc.fe{background:#FFF07A}.ypc.so.fe{background:#F2C79B}
.ypc.ho{color:#C0392B;font-weight:800;background:#F7D0C9}
.ypc.va{background:#C9EBD3;box-shadow:inset 5px 0 0 #2E9E5B}
.ypc.now{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
.ypc.sel{background:#FFD3BC!important;color:#16222B!important;box-shadow:inset 5px 0 0 #D9480F}
.ypd{white-space:nowrap;overflow:hidden;text-overflow:clip}
.yps{flex:none;min-width:13px;height:13px;border-radius:3px;font:800 9px/13px var(--f-body);text-align:center}
.yps.free{background:var(--free-bd);color:var(--free-ink);box-shadow:inset 0 0 0 1px var(--free-ink)}.ypc.fr:not(.sa):not(.so):not(.fe):not(.ho):not(.va):not(.sel){background:color-mix(in srgb,var(--free-bg) 45%,var(--card))}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .ypc.sa{background:#3A3420} :root:not([data-theme="light"]) .ypc.so{background:#4A3420} :root:not([data-theme="light"]) .ypc.fe{background:#4A4410} :root:not([data-theme="light"]) .ypc.ho{background:#4A2420;color:#FF9A8E} :root:not([data-theme="light"]) .ypc.va{background:#1F4A30} :root:not([data-theme="light"]) .ypc.sel{background:#6A3418!important;color:#fff!important} }
:root[data-theme="dark"] .ypc.sa{background:#3A3420}:root[data-theme="dark"] .ypc.so{background:#4A3420}:root[data-theme="dark"] .ypc.fe{background:#4A4410}:root[data-theme="dark"] .ypc.ho{background:#4A2420;color:#FF9A8E}:root[data-theme="dark"] .ypc.va{background:#1F4A30}:root[data-theme="dark"] .ypc.sel{background:#6A3418!important;color:#fff!important}
.yplg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--soft);justify-content:center}.yplg span{display:inline-flex;align-items:center;gap:4px}.yplg .ypc{width:14px;height:12px;border:1px solid var(--rule);border-radius:3px;padding:0}
.ypbar{display:flex;align-items:center;gap:8px;height:76px;overflow:hidden;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:8px 10px;min-height:56px}
.ypbar small{display:block;color:var(--soft);font-size:12px;line-height:1.25}.ypbar b{font-size:15px}.ypbar .btn{min-height:44px}
.ypopen{width:100%;min-height:48px}
.bigvac{min-height:60px;font-size:20px;margin:4px 0 8px}.utop{margin-bottom:8px}.rmvac{width:100%;margin-bottom:12px}.uerow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--rule);padding:8px 0}.uerow small{display:block;color:var(--soft)}.uerow .btn{min-width:44px;padding-inline:10px}.morebtn{display:block;margin:8px 0 0 auto;font-weight:700}
.ypquota{margin:0;font-size:14px;white-space:nowrap}.ypquota b{font-size:19px;color:var(--ok)}.ypquota.none b{color:var(--bad)}
@media (max-width:420px){.ypbar{gap:6px;padding:6px 8px}.ypbar b{font-size:13px}.ypbar small{font-size:11px}.ypbar .btn{padding-inline:10px}}
.ypwarn{color:var(--bad)!important;font-weight:700}
.banner.bad{border-color:var(--bad);color:var(--bad);font-weight:600}
/* Im Jahreskalender erscheinen Meldungen oben, damit unten kein Knopf verdeckt wird */
body.ypon .toast,body:has(#yplan:not([hidden])) .toast{bottom:auto!important;top:calc(64px + env(safe-area-inset-top,0px))}
.yimg img{width:100%;height:auto;border:1px solid var(--rule);border-radius:8px;display:block;background:#fff}
.ypstep{font-weight:700;font-size:14px;line-height:1.3}.ypflash{animation:ypfl .9s}@keyframes ypfl{0%,100%{box-shadow:none}40%{box-shadow:0 0 0 4px var(--accent)}}
.instcard{display:flex;align-items:center;gap:10px;border-left:4px solid var(--accent)}.instcard small{display:block;color:var(--soft);font-size:13px}.inststeps{display:grid;gap:10px;padding-left:22px;font-size:16px}
.applink{font:600 15px/1.4 var(--f-body);word-break:break-all;background:var(--tint);border-radius:8px;padding:10px 12px;margin:4px 0 10px;user-select:all}
.stimes summary{font-weight:800;font-size:16px;cursor:pointer;min-height:32px}.strow{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--rule);background:none;padding:10px 2px;text-align:left;font:inherit;color:inherit;min-height:52px}.strow small{display:block;color:var(--soft);font-size:13px}.stimes .btn{margin-top:8px}
.wbox h3{margin:6px 0}.wor{margin:2px 0;text-align:center}
.mrow{width:100%;min-height:56px}.mrow .qi{font-size:22px;width:32px;text-align:center}
.pdfopt{flex-wrap:wrap;gap:8px}.pdfopt .seg button{padding:9px 10px}
.ptab .tbl td,.ptab .tbl th{font-size:13px;padding:5px 4px}.ptab .tbl .chip{height:18px;min-width:22px;font-size:11px}
.tmk{font-size:18px;line-height:1;display:inline-flex;align-items:center;gap:1px}.tmk.sm{font-size:11px}.tmk b{font-size:8px;color:var(--ink)}
.tgrid .tday{min-height:56px;align-content:start}.tmks{display:flex;flex-wrap:wrap;gap:1px;justify-content:center}.tday.over{box-shadow:inset 0 0 0 2px var(--bad)}
.tlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px}.tnote{display:flex;gap:10px;align-items:center;border-top:1px solid var(--rule);padding:8px 0}.tnote.new b{color:var(--accent)}.tnote small{display:block;color:var(--soft)}
.turg{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--tint)}.turg.mid{background:#FFE8B3;color:#7A5200}.turg.hi{background:#FAD4D4;color:#B42318}
.tmrow{border-top:1px solid var(--rule);padding:10px 0;display:grid;gap:8px}.tpal{display:flex;flex-wrap:wrap;gap:6px}.tpal button{width:28px;height:28px;border-radius:50%;border:2px solid transparent}.tpal button.on{border-color:var(--ink)}.tpal .tsh{background:var(--card);border:1px solid var(--rule);border-radius:6px;font-size:16px}.tpal .tsh.on{border:2px solid var(--ink)}
.banner.tip>.grow{flex:1 1 100%}
.tconf{border-top:1px solid var(--rule);padding:10px 0;display:grid;gap:8px}.tconf small{display:block;color:var(--soft)}.tconf .row{flex-wrap:wrap}
.vs{display:grid;gap:22px;font-size:18px;padding:4px 0 8px}.vsrest{text-align:center;font-size:28px;font-weight:800;line-height:1.25;margin:4px 0 0;color:var(--ink)}.vsrest b{font-size:40px;color:var(--accent)}.vsrest small{display:block;font-size:18px;font-weight:600;color:var(--soft)}
.vsnav{display:flex;align-items:center;justify-content:space-between;gap:10px}.vsnav h3{margin:0;font-size:24px;text-align:center;flex:1;color:var(--ink);text-transform:none;letter-spacing:0}.vsnav button{min-width:56px;min-height:56px;font-size:30px;font-weight:800;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.vsgrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px;touch-action:none;user-select:none;-webkit-user-select:none}.vsgrid .dw{font-size:18px;font-weight:700;text-align:center;color:var(--soft);padding:4px 0}
.vsgrid button{min-height:52px;font:inherit;font-size:20px;font-weight:700;border:0;background:transparent;color:var(--ink);cursor:pointer;padding:0}.vsgrid button.we{color:var(--soft)}.vsgrid button.has{box-shadow:inset 0 -5px 0 #2E8B57}
.vsgrid button.isnow{text-decoration:underline;text-underline-offset:4px}.vsgrid button.sel{background:#C2410C;color:#fff}.vsgrid button.s0{border-radius:26px 0 0 26px}.vsgrid button.s1{border-radius:0 26px 26px 0}.vsgrid button.s0.s1{border-radius:26px}
.vsline{text-align:center;font-size:20px;font-weight:700;margin:0;min-height:28px}.vsmsg{margin:0;text-align:center;font-size:18px;font-weight:600;padding:14px;border-radius:14px;background:#FFF1E0;color:#7A3B00}.vsgo{width:100%;min-height:60px;font-size:22px}
.urest{text-align:center;display:grid;gap:12px;padding:24px 18px}.urtxt{margin:0;font-size:28px;font-weight:800;line-height:1.25}.urtxt b{font-size:40px;color:var(--accent)}.urtxt b.bad{color:var(--bad)}.ursub{margin:0;font-size:18px;color:var(--soft)}
.umeter{height:16px;border-radius:8px;margin:0}.uwide{width:100%;min-height:56px;font-size:20px}.ulist{display:grid;gap:4px}.ulist h2{margin-bottom:8px}
.urow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 4px;border:0;border-top:1px solid var(--rule);background:none;font:inherit;font-size:19px;color:var(--ink);text-align:left;cursor:pointer}.urow b{white-space:nowrap}.urow .chev{font-size:26px;color:var(--soft)}.urow.hl{background:var(--tint)}

<script>
/* ===================== Grundlagen ===================== */
const $=s=>document.querySelector(s);
function el(tag,cls,txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addD=(s,n)=>{ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); };

const MON=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONS=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const DOW=["So","Mo","Di","Mi","Do","Fr","Sa"];
const fmt=s=>{ const d=parse(s); return DOW[d.getDay()]+", "+d.getDate()+". "+MON[d.getMonth()]+" "+d.getFullYear(); };
const fmtS=s=>{ const d=parse(s); return d.getDate()+"."+(d.getMonth()+1)+"."; };
function uid(){ return Math.random().toString(36).slice(2,9); }

/* Feiertage (alle Bundesländer) */
function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da); }
const holCache={};
/* Feiertage, die nur in Teilen eines Bundeslands gelten – zum Ein-/Ausschalten */
const LOCAL_HOL={BY:[["BY_MH","Mariä Himmelfahrt (15.8.)","in Gemeinden mit überwiegend katholischer Bevölkerung",true],["BY_AUG","Augsburger Friedensfest (8.8.)","nur im Stadtgebiet Augsburg",false]],
  SN:[["SN_FL","Fronleichnam","in einigen sorbisch geprägten Gemeinden",false]], TH:[["TH_FL","Fronleichnam","in einigen Gemeinden im Eichsfeld",false]]};
const localOn=(k,def)=>S.localHol&&S.localHol[k]!=null?!!S.localHol[k]:def;
function holidays(y){
  const land=S.land, key=y+land+JSON.stringify(S.localHol||{}); if(holCache[key]) return holCache[key];
  const E=iso(easter(y)), H={};
  const add=(s,n,st)=>{ if(!st || st.includes(land)) H[s]=n; };
  add(y+"-01-01","Neujahr"); add(y+"-01-06","Hl. Drei Könige",["BW","BY","ST"]); add(y+"-03-08","Frauentag",["BE","MV"]);
  add(addD(E,-2),"Karfreitag"); add(E,"Ostersonntag",["BB"]); add(addD(E,1),"Ostermontag"); add(y+"-05-01","Tag der Arbeit");
  add(addD(E,39),"Himmelfahrt"); add(addD(E,49),"Pfingstsonntag",["BB"]); add(addD(E,50),"Pfingstmontag");
  add(addD(E,60),"Fronleichnam",["BW","BY","HE","NW","RP","SL"]); add(y+"-08-15","Mariä Himmelfahrt",["SL"]);
  if(land==="BY"&&localOn("BY_MH",true)) H[y+"-08-15"]="Mariä Himmelfahrt"; if(land==="BY"&&localOn("BY_AUG",false)) H[y+"-08-08"]="Augsburger Friedensfest";
  if((land==="SN"||land==="TH")&&localOn(land+"_FL",false)) H[addD(E,60)]="Fronleichnam"; add(y+"-09-20","Weltkindertag",["TH"]);
  add(y+"-10-03","Tag der Dt. Einheit"); add(y+"-10-31","Reformationstag",["BB","MV","SN","ST","TH","HB","HH","NI","SH"]);
  add(y+"-11-01","Allerheiligen",["BW","BY","NW","RP","SL"]);
  let bb=y+"-11-22"; while(parse(bb).getDay()!==3) bb=addD(bb,-1); add(bb,"Buß- und Bettag",["SN"]);
  add(y+"-12-25","1. Weihnachtstag"); add(y+"-12-26","2. Weihnachtstag");
  return holCache[key]=H;
}
const holName=s=>holidays(+s.slice(0,4))[s]||null;
const LAENDER=[["BW","Baden-Württemberg"],["BY","Bayern"],["BE","Berlin"],["BB","Brandenburg"],["HB","Bremen"],["HH","Hamburg"],["HE","Hessen"],["MV","Mecklenburg-Vorpommern"],["NI","Niedersachsen"],["NW","Nordrhein-Westfalen"],["RP","Rheinland-Pfalz"],["SL","Saarland"],["SN","Sachsen"],["ST","Sachsen-Anhalt"],["SH","Schleswig-Holstein"],["TH","Thüringen"]];

/* ===================== Daten ===================== */
const KINDS={work:"Arbeit",free:"Frei",vac:"Urlaub",sick:"Krank"};
const PALETTE=["#E0A100","#E8590C","#4A3FB5","#1C7C9C","#2E8B57","#C2185B","#6B7A85","#8E5A2B","#0B8A83","#7B2FA3"];
function mondayOnOrBefore(s){ let d=s; while(parse(d).getDay()!==1) d=addD(d,-1); return d; }
function defaults(){
  const t=TODAY();
  return { v:1, example:true, land:"NW", holFree:false, showFerien:true, vacPerYear:30, carry:{},
    types:[
      {id:"F",name:"Tagschicht",short:"T",color:"#1C6DD0",start:"06:00",end:"14:00",pause:30,kind:"work"},
      {id:"S",name:"Spätschicht",short:"S",color:"#E8590C",start:"14:00",end:"22:00",pause:30,kind:"work"},
      {id:"N",name:"Nachtschicht",short:"N",color:"#111111",start:"22:00",end:"06:00",pause:30,kind:"work"},
      {id:"U",name:"Urlaub",short:"U",color:"#2E8B57",start:"",end:"",pause:0,kind:"vac"},
      {id:"K",name:"Krank",short:"K",color:"#C2185B",start:"",end:"",pause:0,kind:"sick"},
      {id:"X",name:"Frei",short:"F",color:"#6B7A85",start:"",end:"",pause:0,kind:"free"}],
    rots:[{id:"r1",name:"Wechselschicht 2-2-2 / 4 frei",start:addD(mondayOnOrBefore(t),-360),pattern:["F","F","S","S","N","N",null,null,null,null]}],
    ov:{}, notes:{}, vacs:[], tpls:[] };
}
let S;
S=null;

const typeOf=id=>S.types.find(t=>t.id===id)||null;
function isDark(hex){ const h=hex.replace("#",""); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return (r*299+g*587+b*114)/1000>165; }
function isDeep(hex){ const h=String(hex||"").replace("#",""); if(h.length!==6) return false; const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return (r*299+g*587+b*114)/1000<40; }
function chip(t,extra){ const c=el("span","chip"+(extra?" "+extra:"")); if(!t||t.kind==="free"){ c.classList.add("free"); c.textContent=t?t.short:((S.types.find(x=>x.kind==="free")||{}).short||"–"); if(t) c.title=t.name; return c; } c.style.setProperty("--c",t.color); if(isDark(t.color)) c.classList.add("dark"); if(isDeep(t.color)) c.classList.add("deep"); c.textContent=t.short; c.title=t.name; return c; }
/* Welcher Rhythmus gilt an einem Tag? Vor dem ersten Rhythmus gilt dieser auch rückwärts (sonst wäre die Vergangenheit leer). */
function rotAt(s){ let best=null, first=null; for(const r of S.rots){ if(!r.pattern.length) continue; const f=r.from||r.start; if(f<=s && (!r.end || s<=r.end) && (!best || f>(best.from||best.start))) best=r; if(!first || f<(first.from||first.start)) first=r; } if(!best && first && s<(first.from||first.start)) best=first; return best; }
function baseShift(s){ const r=rotAt(s); if(!r) return null; const n=r.pattern.length, i=((diffD(r.start,s)%n)+n)%n; const id=r.pattern[i]; const t=id?typeOf(id):null;
  if(t && t.kind==="work" && S.holFree && holName(s)) return null;
  if(t && t.kind==="work" && S.weekendFree){ const w=parse(s).getDay(); if(w===0||w===6) return null; } return t; }
function cleanTypes(){ if(!S.tagMig){ S.tagMig=1; const f=S.types.find(t=>t.id==="F"&&/^Frühschicht$/i.test(t.name)); if(f){ f.name="Tagschicht"; if(f.short==="F") f.short="T"; if(/^#E0A100$/i.test(f.color)) f.color="#1C6DD0"; }
    const n=S.types.find(t=>t.id==="N"&&/^#4A3FB5$/i.test(t.color)); if(n) n.color="#111111"; const x=S.types.find(t=>t.kind==="free"&&t.short==="X"); if(x) x.short="F"; }
  const fx=S.types.find(t=>t.id==="X"&&t.name==="Frei (getauscht)"); if(fx) fx.name="Frei";
  const T=S.types.find(t=>t.id==="T"&&t.name==="Tagschicht"); if(T){ const used=(S.rots||[]).some(r=>r.pattern.includes("T"))||Object.values(S.ov).includes("T")||(S.tpls||[]).some(x=>x.weeks.flat().includes("T")); if(!used){ S.types=S.types.filter(t=>t!==T); } } }
/* Schichtart löschen – mit Nachfrage */
function deleteType(t,after){
  if(t.kind==="vac"){ toast("„Urlaub“ wird für die Urlaubsplanung gebraucht und kann nicht gelöscht werden."); return; }
  const days=Object.keys(S.ov).filter(k=>S.ov[k]===t.id).length, rots=(S.rots||[]).filter(r=>r.pattern.includes(t.id)).length, tpls=(S.tpls||[]).filter(x=>x.weeks.flat().includes(t.id)).length;
  const used=days||rots||tpls;
  const txt= used ? "„"+t.name+"“ ist noch eingetragen"+(days?" an "+days+(days===1?" Tag":" Tagen"):"")+(rots?(days?",":"")+" in "+rots+" Rotation"+(rots===1?"":"en")+" im Kalender":"")+(tpls?((days||rots)?" und":"")+" in "+tpls+" Vorlage"+(tpls===1?"":"n"):"")+".\nWenn du sie löschst, werden diese Tage frei. Bist du sicher?" : "Bist du sicher, dass du „"+t.name+"“ löschen willst?";
  ask("Schicht löschen?",txt,[{label:"Ja, löschen",pri:true,fn:()=>{ const old=JSON.parse(JSON.stringify({types:S.types,ov:S.ov,rots:S.rots,tpls:S.tpls||[]})), vb=vacSnap(), vo=JSON.parse(JSON.stringify(vacList()));
      (S.rots||[]).forEach(r=>{ r.pattern=r.pattern.map(id=>id===t.id?null:id); });
      for(const k of Object.keys(S.ov)) if(S.ov[k]===t.id){ const b=baseShift(k); if(b&&b.kind==="work") S.ov[k]=""; else delete S.ov[k]; }
      (S.tpls||[]).forEach(x=>{ x.weeks=x.weeks.map(w=>w.map(id=>id===t.id?null:id)); });
      S.types=S.types.filter(x=>x.id!==t.id); if(brush===t.id) brush=null;
      save(); if(after) after(); else { closeSheet(); render(); }
      vacCheck(vb,vo,()=>toast("„"+t.name+"“ gelöscht","Rückgängig",()=>{ Object.assign(S,old); S.vacs=vo; save(); render(); })); }},{label:"Nein",fn:()=>{}}]); }
/* Eigene Schicht ohne Urlaub */
function ownShift(s){ if(Object.prototype.hasOwnProperty.call(S.ov,s)){ const o=S.ov[s]; const t=o?typeOf(o):null; if(!t || t.kind!=="vac") return t; } return baseShift(s); }
/* Urlaub = Zeiträume; gezählt wird an Tagen, an denen man laut Schichtplan arbeiten würde */
function vacList(){ if(!Array.isArray(S.vacs)) S.vacs=[]; return S.vacs; }
function vacAt(s){ return vacList().find(v=>v.a<=s && s<=v.e)||null; }
/* Zählt dieser Tag als Urlaubstag? Nur Arbeitstage laut Schichtplan – nie Feiertage, nie freie Tage.
   Ohne Schichtplan an dem Tag: Montag bis Freitag. */
function vacDayCounts(s){ if(holName(s)) return false; const own=ownShift(s); if(own) return own.kind==="work";
  return !rotAt(s) && !Object.prototype.hasOwnProperty.call(S.ov,s) && ![0,6].includes(parse(s).getDay()); }
function vacOnDay(v,s){ const own=ownShift(s); if(own && own.kind==="sick") return false; if(holName(s)) return false; if(v.fixed) return v.fixed.includes(s); return vacDayCounts(s); }
/* ===== Team-Vorbereitung (Architektur) =====
   Private Daten (S.vacs, S.ov …) und Team-Sichtbarkeit sind getrennt: S.share.vac[urlaubsId] = true/false
   ist eine eigene Verknüpfungstabelle. Verlässt man ein Team, wird nur diese Tabelle/Team-Kopie gelöscht –
   der private Planer bleibt unberührt. */
function shareVacGet(id){ const m=(S.share&&S.share.vac)||{}; return id in m?!!m[id]:consentGet("vacDefault"); }
function shareVacSet(id,on){ if(!S.share) S.share={}; if(!S.share.vac) S.share.vac={}; S.share.vac[id]=!!on; }
function shareClean(){ const m=(S.share&&S.share.vac)||{}, ids=new Set(vacList().map(v=>v.id)); Object.keys(m).forEach(k=>{ if(!ids.has(k)) delete m[k]; }); }
/* Zentrales Einverständnis-Modul: an einer Stelle für Team-Beitritt, Namensanzeige, Kinder-Angabe, Standard-Sichtbarkeit */
const CONSENT={ teamJoin:{t:"Daten im Team freigeben",d:"Ohne diese Zustimmung wird nichts ans Team übertragen.",def:false},
  showName:{t:"Meinen Namen im Team-Kalender zeigen",d:"Sonst sehen andere nur Farbe und Form.",def:false},
  hasKids:{t:"Ich habe Kinder (Vorrang in den Schulferien)",d:"Wird nur mit Zustimmung zur Datenfreigabe geteilt.",def:false},
  vacDefault:{t:"Neuen Urlaub im Team sichtbar machen",d:"Kann bei jedem Urlaub einzeln geändert werden.",def:true} };
function consentGet(k){ const c=S.consent||{}; return k in c?!!c[k]:!!(CONSENT[k]&&CONSENT[k].def); }
function consentSet(k,v){ if(!S.consent) S.consent={}; S.consent[k]=!!v; save(); }
function consentCard(box){ const c=el("div","card sec"); c.id="consent"; c.append(el("h2",null,"Datenschutz & Freigaben"), el("p","hint","Gilt für die Team-Funktion (kommt bald). Deine privaten Daten bleiben immer nur bei dir."));
  Object.entries(CONSENT).forEach(([k,o])=>{ const l=el("label","sw"), cb=el("input"); cb.type="checkbox"; cb.id="cs_"+k; cb.checked=consentGet(k); cb.onchange=()=>consentSet(k,cb.checked); const tx=el("span"); tx.append(el("b",null,o.t), el("small",null," – "+o.d)); l.append(cb,tx); c.append(l); });
  box.append(c); }
/* Urlaubskontingent: höchstens so viele Urlaubstage pro Kalenderjahr, wie der Anspruch hergibt */
function vacRest(y){ return vacTotal(y)-vacUsed(y); }
function vacOver(days,exclId){ const keep=S.vacs; if(exclId) S.vacs=keep.filter(v=>v.id!==exclId);
  try{ const by={}; days.forEach(d=>{ if(vacAt(d)) return; const y=+d.slice(0,4); by[y]=(by[y]||0)+1; }); const out=[];
    Object.keys(by).forEach(y=>{ const r=vacRest(+y); if(by[y]>r) out.push({y:+y,need:by[y],rest:Math.max(0,r)}); }); return out; } finally{ S.vacs=keep; } }
function quotaMsg(o){ return "Sie überschreiten Ihr Urlaubskontingent. "+o.map(x=>x.rest?x.y+": nur noch "+x.rest+(x.rest===1?" Urlaubstag":" Urlaubstage")+" übrig (gewählt: "+x.need+")":"Dein Urlaub "+x.y+" ist aufgebraucht").join(" · ")+". Erst Urlaub löschen oder den Anspruch erhöhen."; }
function vacDaysOf(v){ const out=[]; for(let s=v.a;s<=v.e;s=addD(s,1)) if(vacOnDay(v,s)) out.push(s); return out; }
function shiftOf(s){ const v=vacAt(s); if(v && vacOnDay(v,s)) return vacType()||ownShift(s); return ownShift(s); }
function normVacs(){ const L=vacList().filter(v=>v.a<=v.e).sort((x,y)=>x.a<y.a?-1:1), out=[];
  for(const v of L){ const l=out[out.length-1]; if(l && addD(l.e,1)>=v.a && !l.fixed && !v.fixed){ if(v.e>l.e) l.e=v.e; } else out.push(v); } S.vacs=out; }
function addVac(a,e){ vacList().push({id:uid(),a,e}); normVacs(); }
/* Einzelnen Urlaubstag setzen (Tagesfenster, Malen): ohne Schichtplan zählt ein Werktag (Mo–Fr, kein Feiertag) wie im Eintragen-Fenster */
function addVacDay(s){ if(vacAt(s)) return; if(vacDayCounts(s) && vacRest(+s.slice(0,4))<=0){ toast(quotaMsg([{y:+s.slice(0,4),need:1,rest:0}])); return; } if(!planKnown(s) && ![0,6].includes(parse(s).getDay()) && !holName(s)){ vacList().push({id:uid(),a:s,e:s,fixed:[s]}); normVacs(); } else addVac(s,s); }
function removeVacDay(s){ const v=vacAt(s); if(!v) return; if(v.fixed) v.fixed=v.fixed.filter(x=>x!==s);
  if(v.a===v.e){ S.vacs=S.vacs.filter(x=>x!==v); return; } if(s===v.a){ v.a=addD(s,1); return; } if(s===v.e){ v.e=addD(s,-1); return; }
  const n={id:uid(),a:addD(s,1),e:v.e}; if(v.fixed){ n.fixed=v.fixed.filter(x=>x>s); v.fixed=v.fixed.filter(x=>x<s); } v.e=addD(s,-1); S.vacs.push(n); normVacs(); }
function migrateVac(){ vacList(); const vt=S.types.filter(t=>t.kind==="vac").map(t=>t.id); const days=Object.keys(S.ov).filter(k=>vt.includes(S.ov[k])).sort(); if(!days.length) return;
  days.forEach(k=>delete S.ov[k]); let cur=null;
  days.forEach(d=>{ if(cur){ let join=true; for(let k=addD(cur.e,1);k<d;k=addD(k,1)){ const t=ownShift(k); if(t&&t.kind==="work"){ join=false; break; } } if(join){ cur.e=d; return; } } cur={id:uid(),a:d,e:d}; S.vacs.push(cur); }); normVacs(); }
function vacSnap(){ const m={}; vacList().forEach(v=>m[v.id]=vacDaysOf(v)); return m; }
/* Fragt nach, wenn eine Änderung am Schichtplan deinen Urlaub verändert */
function vacCheck(before,oldVacs,done){
  const diffs=[]; vacList().forEach(v=>{ const b0=before[v.id]; if(!b0) return; const b=b0.filter(d=>d>=v.a&&d<=v.e); const now=vacDaysOf(v); if(b.join()!==now.join()) diffs.push({v,b,now}); });
  if(!diffs.length){ done&&done(); return; }
  const txt=diffs.map(d=>"Urlaub "+fmtS(d.v.a)+"–"+fmtS(d.v.e)+": "+d.b.length+" → "+d.now.length+" Urlaubstage").join("\n");
  ask("Urlaub anpassen?","Deine Änderung am Schichtplan betrifft deinen Urlaub:\n"+txt+"\nSoll die Änderung auf deinen Urlaub übertragen werden?",[
    {label:"Ja, übertragen",pri:true,fn:()=>{ save(); render(); toastWith("Urlaub angepasst",done); }},
    {label:"Nein, Urlaubstage behalten",fn:()=>{ diffs.forEach(d=>{ d.v.fixed=d.b.slice(); }); save(); render(); toastWith("Urlaubstage bleiben wie bisher",done); }}]); }
/* Meldung zeigen, ohne eine folgende Meldung mit „Rückgängig“ zu verdecken: beide Texte werden verbunden */
var toastPre=""; function toastWith(msg,done){ toastPre=msg; done&&done(); if(toastPre){ toastPre=""; toast(msg); } }
function ask(title,text,btns){ let a=$("#ask"); if(!a){ a=el("div","ask"); a.id="ask"; document.body.append(a); }
  a.innerHTML=""; const c=el("div","askc"); c.setAttribute("role","alertdialog"); c.append(el("h2",null,title)); text.split("\n").forEach((l,i)=>c.append(el("p",i?"askline":null,l)));
  const r=el("div","askb"); btns.forEach(b=>{ const x=el("button","btn"+(b.pri?" pri":""),b.label); x.type="button"; x.onclick=()=>{ a.hidden=true; b.fn&&b.fn(); }; r.append(x); }); c.append(r); a.append(c); a.hidden=false; }
function minutes(t){ if(!t || t.kind!=="work" || !t.start || !t.end) return 0; const [a,b]=t.start.split(":").map(Number), [c,d]=t.end.split(":").map(Number); let m=(c*60+d)-(a*60+b); if(m<=0) m+=1440; return Math.max(0,m-(+t.pause||0)); }

/* Urlaub */
function vacUsed(y){ let n=0; for(let s=y+"-01-01"; s<=y+"-12-31"; s=addD(s,1)){ const t=shiftOf(s); if(t && t.kind==="vac") n++; } return n; }
function carryOf(y){ if(S.carryAuto&&S.carryAuto[y]) return Math.max(0,Math.min(99,vacTotal(y-1)-vacUsed(y-1))); return +(S.carry[y]||0); }
/* Verfall von Resturlaub: Stichtag (Standard 31.3.), Urlaub im neuen Jahr wird zuerst vom Rest abgezogen */
function expCfg(){ const e=S.expire||{}; return {on:e.on!==false, md:/^\d\d-\d\d$/.test(e.md||"")?e.md:"03-31"}; }
function expInfo(y,co){ const c=expCfg(); if(!c.on) return null; const carry=co!=null?co:carryOf(y); if(carry<=0) return null; const date=y+"-"+c.md; let u=0;
  for(let s=y+"-01-01"; s<=date; s=addD(s,1)){ const t=shiftOf(s); if(t&&t.kind==="vac") u++; } const left=Math.max(0,carry-u); return {carry,date,used:Math.min(carry,u),left,passed:TODAY()>date}; }

function vacBase(){ const b=+S.vacPerYear||0; return S.wmode==="teil"&&S.vacProRata&&wDays()<5?Math.round(b*wDays()/5):b; }
function vacTotal(y){ const x=expInfo(y); return vacBase()+carryOf(y)+((S.vacCorr&&+S.vacCorr[y])||0)-(x&&x.passed?x.left:0); }
/* Hinweis „X Tage aus Vorjahr verfallen am …“ (nur solange noch etwas zu retten ist) */
function expWarn(y){ const x=expInfo(y); if(!x||x.passed||!x.left) return null; return x; }

  const go=el("button","btn pri","Jetzt einplanen"); go.type="button"; go.onclick=()=>{ agState.year=y; openAgent(); };
  const st=el("button","btn ghost","Stichtag ändern"); st.type="button"; st.onclick=()=>openVacSettings(y); b.append(t,go,st); return b; }

/* Urlaub über den Jahreswechsel: Tage je Jahr aufteilen und Rest je Jahr zeigen */
function vacYears(days){ const m={}; days.forEach(d=>{ const y=+d.slice(0,4); m[y]=(m[y]||0)+1; }); return Object.keys(m).map(Number).sort().map(y=>({y,n:m[y],rest:vacTotal(y)-vacUsed(y)-m[y]})); }

      while(KAL.e-KAL.a+1>KAL_MAX){ const l=sc.querySelector('[data-ym="'+KAL.e+'"]'); if(l) l.remove(); KAL.e--; } }
    else if(sc.scrollHeight-sc.scrollTop-sc.clientHeight<300){ for(let v=KAL.e+1; v<=KAL.e+KAL_STEP; v++) sc.append(monthBlock(v)); KAL.e+=KAL_STEP;
      while(KAL.e-KAL.a+1>KAL_MAX){ const f=sc.querySelector('[data-ym="'+KAL.a+'"]'); if(f){ const h=f.offsetHeight; f.remove(); sc.scrollTop-=h; } KAL.a++; } }

    if(!(s in snap)) snap[s]=Object.prototype.hasOwnProperty.call(S.ov,s)?S.ov[s]:undefined;
    const base=baseShift(s), baseId=base?base.id:"", bt=brush&&brush!=="reset"?typeOf(brush):null;
    if(bt && bt.kind==="vac"){ if(erase) removeVacDay(s); else if(!vacAt(s)) addVacDay(s); }

    else { const target=erase?"":brush; if(baseId===target) delete S.ov[s]; else S.ov[s]=target; if(bt && bt.kind==="work" && vacAt(s)) conf.push(s); }

          {label:"Ja, Schicht eintragen",pri:true,fn:()=>{ cf.forEach(removeVacDay); save(); fin(); }},
          {label:"Nein, Urlaub behalten",fn:()=>{ cf.forEach(k=>{ if(sn[k]===undefined) delete S.ov[k]; else S.ov[k]=sn[k]; }); save(); fin(); }}]);
        else if(Object.keys(before).length) fin(); }

    if(pend){ const c=pend.c; unpend(); if(Math.abs(e.clientY-startY)<10 && Math.abs(e.clientX-startX)<10){ start(c,e); end(e); } return; }
    if(!selMode && x0!=null && Math.abs(e.clientX-x0)>60 && Math.abs(e.clientY-startY)<40){ g.dataset.skip="1"; setTimeout(()=>delete g.dataset.skip,50); kalJump(ymOf(curY,curM)+(e.clientX<x0?1:-1)); } x0=null; };

const MONF_=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function vsDays(a,e){ const out=[]; for(let s=a;s<=e;s=addD(s,1)){ if(vacAt(s)) continue; const x=ownShift(s);
  if(x ? x.kind==="work" : (!planKnown(s) && ![0,6].includes(parse(s).getDay()))) { if(!holName(s)) out.push(s); } } return out; }
function vsRange(a,e){ const da=+a.slice(8,10), de=+e.slice(8,10), ma=+a.slice(5,7)-1, me=+e.slice(5,7)-1;
  if(a===e) return da+". "+MONF_[ma]; if(a.slice(0,7)===e.slice(0,7)) return da+". bis "+de+". "+MONF_[me];
  return da+". "+MONF_[ma]+(a.slice(0,4)!==e.slice(0,4)?" "+a.slice(0,4):"")+" bis "+de+". "+MONF_[me]+(a.slice(0,4)!==e.slice(0,4)?" "+e.slice(0,4):""); }

    grid.addEventListener("pointerup",up); grid.addEventListener("pointercancel",()=>{ drag=null; });

  if(!keys.length) return null;

  for(let s=start;s<=end;s=addD(s,1)){ const t=shiftOf(s); seq.push(t && t.kind==="work"?t.id:null); }

  for(let q=2;q<=Math.min(42,len-1);q++){ if(len-q<2) break; let ok=true; for(let i=0;i+q<len;i++) if(seq[i]!==seq[i+q]){ ok=false; break; } if(ok){ p=q; break; } }
  return {pattern:seq.slice(0,p), from:addD(end,1), pos:len%p, repeated:p<len, start, end, len};

function shiftSplit(s,x){ const r={min:0,hol:0}; if(!x||x.kind!=="work"||!x.start||!x.end) return r;
  const [a,b]=x.start.split(":").map(Number), [c,d]=x.end.split(":").map(Number); let len=(c*60+d)-(a*60+b); if(len<=0) len+=1440; let paid=Math.max(0,len-(+x.pause||0)), f=len?paid/len:0;
  let ho=0; const s2=addD(s,1), holA=!!holName(s), holB=!!holName(s2);
  for(let m=a*60+b, i=0; i<len; i++, m++){ if(m>=1440?holB:holA) ho++; }

/* Arbeitszeit, Urlaub/Krank für einen beliebigen Zeitraum (z. B. Abrechnung 16.–15.) */
function rangeWork(a,e){ const o={min:0,hol:0,vac:0,sick:0,vacN:0,sickN:0,cr:0,shifts:0,we:0,hd:0,cnt:new Map()}; const ft=S.types.find(t=>t.kind==="free"), fc=ft?+ft.credit||0:0;

/* Gutschrift pro Urlaubs-/Krankheitstag: Soll ÷ 5, sonst Schnitt der Schichten im Zeitraum, sonst Schnitt der Schichten im Rhythmus */
const wDays=()=>Math.max(1,Math.min(7,+S.wdays||5));
function creditMin(o){ if(+S.soll>0) return Math.round(+S.soll*60/wDays()); if(o.shifts) return Math.round(o.min/o.shifts);
  const ids=(S.rots||[]).flatMap(r=>r.pattern).filter(Boolean), L=(ids.length?ids:S.types.map(t=>t.id)).map(typeOf).filter(t=>t&&t.kind==="work"&&minutes(t)>0); return L.length?Math.round(L.reduce((a,t)=>a+minutes(t),0)/L.length):0; }
/* Soll: Wochenstunden ÷ 7 pro Kalendertag; gesetzliche Feiertage Mo–Fr senken das Soll um Wochenstunden ÷ 5 */
function holWeekdays(a,e){ let n=0; for(let s=a;s<=e;s=addD(s,1)){ const w=parse(s).getDay(); if(w>0&&w<6&&holName(s)) n++; } return n; }

/* ---------- Start ---------- */
async function boot(){ lsSet("su_team",null); lsSet("su_team_cache",null);
  if(CFG.localMode){ sess=null;
    /* Daten aus einer früheren Anmeldung auf diesem Gerät übernehmen */
    if(!lsGet(dataKey())){ try{ let best=null; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!/^su_data_.+$/.test(k) || /_dirty$/.test(k)) continue; const d=JSON.parse(localStorage.getItem(k)); if(validData(d) && (!best || (d.updated||0)>(best.updated||0))) best=d; } if(best) lsSet(dataKey(),JSON.stringify(best)); }catch(e){} }
    S=load(); if(!S || !S.onboarded){ S=S||defaults(); openOnboarding(); return; } enterApp(); return; }
  if(!CFG.apiKey || !CFG.projectId || /HIER_/.test(CFG.apiKey+CFG.projectId)){ authLoading("Die App ist noch nicht eingerichtet (config.js)."); return; }
  try{ sess=JSON.parse(lsGet("su_sess")||"null"); }catch(e){ sess=null; }
  if(!sess || !sess.uid){ sess=null; showAuth("login"); return; }
  S=load();
  if(!S){ authLoading("Lade deine Daten …");
    try{ const r=await cloudGet(); if(r && r.data){ const d=JSON.parse(r.data); if(validData(d)){ S=d; lsSet(dataKey(),r.data); } } }
    catch(e){ const c=String(e.code||e.message);
      if(/NETWORK|Failed to fetch/.test(c)){ $("#aloadt").textContent="Keine Internetverbindung. Beim ersten Anmelden auf einem Gerät brauche ich Internet."; $("#aretry").hidden=false; return; }
      if(/TOKEN|REFRESH|USER_NOT_FOUND|USER_DISABLED|PERMISSION|UNAUTH/.test(c)){ lsSet("su_sess",null); sess=null; showAuth("login","Bitte melde dich neu an."); return; } } }
  if(!S || !S.onboarded){ S=S||defaults(); openOnboarding(); return; }
  enterApp(); pull();
}

/* Umrechner: Dezimal ↔ Stunden/Minuten ↔ Minuten */
function converterCard(){ const c=el("div","card sec conv"); c.append(el("h3",null,"Umrechner"));
  const mk=(lab,ph,mode)=>{ const l=el("label","f",lab), i=el("input"); i.type="text"; i.inputMode=mode||"numeric"; i.placeholder=ph; i.autocomplete="off"; l.append(i); return [l,i]; };
  const [lD,iD]=mk("Dezimal (Std.)","7,5","decimal"), [lH,iH]=mk("Stunden","7"), [lN,iN]=mk("Minuten","30"), [lM,iM]=mk("Minuten gesamt","450");
  const g=el("div","two"); g.append(lH,lN); c.append(lD,g,lM); const out=el("p","hint"); c.append(out); let cv=null;
  const num=v=>{ const t=String(v).trim().replace(",","."); if(t==="") return null; const n=parseFloat(t); return isFinite(n)&&n>=0?n:NaN; };
  const fill=src=>{ if(src!==iD) iD.value=cv==null?"":String(Math.round(cv/60*100)/100).replace(".",","); if(src!==iH) iH.value=cv==null?"":String(Math.floor(cv/60)); if(src!==iN) iN.value=cv==null?"":String(cv%60); if(src!==iM) iM.value=cv==null?"":String(cv); out.textContent=cv==null?"Eine Zahl eintippen – die anderen Felder rechnen mit.":"= "+hmm(cv)+" Std. = "+dec(cv)+" Std. = "+cv+" Min."; };
  iD.oninput=()=>{ const n=num(iD.value); if(Number.isNaN(n)) return; cv=n==null?null:Math.round(n*60); fill(iD); };
  const hm=src=>{ const h=num(iH.value), m=num(iN.value); if(Number.isNaN(h)||Number.isNaN(m)) return; cv=(h==null&&m==null)?null:Math.round((h||0)*60+(m||0)); fill(src); }; iH.oninput=()=>hm(iH); iN.oninput=()=>hm(iN);
  iM.oninput=()=>{ const n=num(iM.value); if(Number.isNaN(n)) return; cv=n==null?null:Math.round(n); fill(iM); }; fill(null); return c; }
/* Urlaub entfernen: Zeitraum von–bis oder ein ganzes Jahr zurücksetzen (mit Rückgängig) */
function vacRemoveRange(a,e){ const old=JSON.parse(JSON.stringify(vacList())); let k=0;
  for(let d=a;d<=e;d=addD(d,1)) if(vacAt(d)){ if(dayKind(d)==="v") k++; removeVacDay(d); }
  S.vacs=vacList().filter(v=>vacDaysOf(v).length||v.e<a||v.a>e); normVacs(); save(); render(); return {k,old}; }
function openVacRemove(y){ openSheet(p=>{ sheetTop(p,"Urlaub entfernen"); p.dataset.sheet="vacremove";
    p.append(el("p","hint","Wähle den Zeitraum. Alle Urlaubstage darin werden gelöscht und stehen sofort wieder zur Verfügung."));
    const two=el("div","two"), la=el("label","f","Von"), lb=el("label","f","Bis"), ia=el("input"), ib=el("input"); ia.type=ib.type="date"; ia.id="vr_from"; ib.id="vr_to";
    const nx=vacList().filter(v=>v.e>=TODAY()).sort((x,z)=>x.a<z.a?-1:1)[0]; ia.value=nx?nx.a:y+"-01-01"; ib.value=nx?nx.e:y+"-12-31"; la.append(ia); lb.append(ib); two.append(la,lb); p.append(two);
    const info=el("div","card"); p.append(info); const go=el("button","btn bad","🗑 Diesen Urlaub entfernen"); go.type="button";
    const upd=()=>{ info.innerHTML=""; const a=ia.value, e=ib.value; if(!a||!e||e<a){ info.append(el("div","muted","Bitte Von und Bis wählen.")); go.disabled=true; return; }
      let k=0; for(let d=a;d<=e;d=addD(d,1)) if(dayKind(d)==="v") k++; info.append(el("b","num",k+(k===1?" Urlaubstag":" Urlaubstage")+" werden entfernt")); go.disabled=!k; };
    ia.oninput=()=>{ if(ib.value<ia.value) ib.value=ia.value; upd(); }; ib.oninput=upd; upd();
    go.onclick=()=>{ const a=ia.value, e=ib.value, r=vacRemoveRange(a,e), yy=+a.slice(0,4); closeSheet(); toast(r.k+(r.k===1?" Urlaubstag":" Urlaubstage")+" entfernt · noch "+vacRest(yy)+" übrig ("+yy+")","Rückgängig",()=>{ S.vacs=r.old; save(); render(); }); };
    p.append(go);
    const all=el("button","btn ghost","Ganzen Urlaub "+y+" zurücksetzen"); all.type="button";
    all.onclick=()=>ask("Ganzen Urlaub "+y+" löschen?","Alle Urlaubstage im Jahr "+y+" werden entfernt.",[{label:"Ja, alles löschen",pri:true,fn:()=>{ const r=vacRemoveRange(y+"-01-01",y+"-12-31"); closeSheet(); toast("Urlaub "+y+" zurückgesetzt · "+vacRest(y)+" Tage übrig","Rückgängig",()=>{ S.vacs=r.old; save(); render(); }); }},{label:"Abbrechen"}]);
    p.append(all); }); }
function openVacBlock(b){ const v0=vacList().find(x=>x.id===b.id); if(!v0){ toast("Diesen Urlaub gibt es nicht mehr."); return; }
  openSheet(p=>{ sheetTop(p,"Urlaub bearbeiten"); p.dataset.sheet="vacedit";
    const two=el("div","two"), la=el("label","f","Von"), lb=el("label","f","Bis"), ia=el("input"), ib=el("input"); ia.type=ib.type="date"; ia.id="ve_from"; ib.id="ve_to"; ia.value=v0.a; ib.value=v0.e; la.append(ia); lb.append(ib); two.append(la,lb); p.append(two);
    const info=el("div","card"); p.append(info);
    const others=()=>vacList().filter(x=>x.id!==v0.id);
    const calc=()=>{ info.innerHTML=""; const a=ia.value, e=ib.value; if(!a||!e||e<a){ info.append(el("div","muted","Bitte Von und Bis wählen.")); sv.disabled=true; return null; }
      const keep=S.vacs; S.vacs=others(); const r=vacCount(a,e); S.vacs=keep; const y=+a.slice(0,4);
      info.append(el("b","num",r.n+(r.n===1?" Urlaubstag":" Urlaubstage")), el("div","muted",(diffD(a,e)+1)+" Kalendertage, davon "+r.free+" ohnehin frei"));
      if(r.as) info.append(el("div","hint","Für "+(r.as===r.n?"diesen Zeitraum":r.as+" Tage")+" ist noch kein Schichtplan eingetragen – gerechnet wird mit Montag bis Freitag."));
      const ov=vacOver(r.days,v0.id); if(ov.length) info.append(el("div","banner bad",quotaMsg(ov))); r.over=ov; sv.disabled=!r.n||ov.length>0; return r; };
    const sv=el("button","btn pri","Änderung speichern"); sv.type="button";
    sv.onclick=()=>{ const r=calc(); if(!r) return; if(r.over&&r.over.length){ toast(quotaMsg(r.over)); return; } const old=JSON.parse(JSON.stringify(vacList())); const v=vacList().find(x=>x.id===v0.id); if(!v) return;
      v.a=ia.value; v.e=ib.value; if(v.fixed || r.as) v.fixed=r.days.slice(); normVacs(); save(); closeSheet(); render();
      { const y=+ia.value.slice(0,4); toast("Urlaub geändert: "+fmtS(ia.value)+" – "+fmtS(ib.value)+" · noch "+vacRest(y)+" übrig","Rückgängig",()=>{ S.vacs=old; save(); render(); }); } };
    { const l=el("label","sw"), cb=el("input"); cb.type="checkbox"; cb.id="ve_team"; cb.checked=shareVacGet(v0.id); cb.onchange=()=>{ shareVacSet(v0.id,cb.checked); save(); }; l.append(cb, el("span",null,"Im Team sichtbar (sobald die Team-Funktion aktiv ist)")); p.append(l); }
    ia.oninput=()=>{ if(ib.value<ia.value) ib.value=ia.value; calc(); }; ib.oninput=calc; p.append(sv); calc();
    const r=el("div","row");
    const cal=el("button","btn","Im Kalender zeigen"); cal.type="button"; cal.onclick=()=>{ curY=+v0.a.slice(0,4); curM=+v0.a.slice(5,7)-1; kalMode="monat"; closeSheet(); show("kal"); }; r.append(cal);
    const del=el("button","btn bad","Löschen"); del.type="button"; del.onclick=()=>{ const old=JSON.parse(JSON.stringify(vacList())); S.vacs=vacList().filter(x=>x.id!==v0.id); save(); closeSheet(); toast("Urlaub gelöscht","Rückgängig",()=>{ S.vacs=old; save(); render(); }); }; r.append(del); p.append(r);
    if(v0.fixed){ const un=el("button","btn ghost","Wieder automatisch an den Schichtplan anpassen"); un.type="button"; un.onclick=()=>{ const v=vacList().find(x=>x.id===v0.id); if(v){ delete v.fixed; save(); } closeSheet(); render(); }; p.append(un); } }); }

/* ---------- Teilen (Handy-App: Teilen-Menü; Browser: Teilen oder Download) ---------- */
function b64(bytes){ let s=""; const u=bytes instanceof Uint8Array?bytes:new TextEncoder().encode(String(bytes)); for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
async function shareFile(bytes,fname,mime,title){
  const C=window.Capacitor, P=C&&C.Plugins;
  if(C && C.isNativePlatform && C.isNativePlatform() && P && P.Filesystem && P.Share){
    try{ const w=await P.Filesystem.writeFile({path:fname,data:b64(bytes),directory:"CACHE"}); await P.Share.share({title,text:title,files:[w.uri],dialogTitle:"Teilen"}); return; }
    catch(e){ if(/cancel/i.test(String(e&&e.message))) return; toast("Teilen hat nicht geklappt."); return; } }
  try{ const d=window.claude&&window.claude.use?await window.claude.use("downloads"):null; if(d){ try{ await d.save({filename:fname,data:new Blob([bytes],{type:mime})}); toast("Gespeichert im Ordner „Downloads“"); }catch(e){ if(!e||e.code!=="declined") toast("Speichern hat nicht geklappt."); } return; } }catch(e){}
  const file=new File([bytes],fname,{type:mime});
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  const url=URL.createObjectURL(file); const a=document.createElement("a"); a.href=url; a.download=fname; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); toast("Gespeichert im Ordner „Downloads“"); }

/* Monatsplan als PDF (A4, groß zum Aufhängen/Teilen) */
async function pdfMonth(y,m){ const P=makePDF(); drawMonthPage(P,y,m); await pdfSave(P.build(),"Schichtplan_"+MON[m]+"_"+y+".pdf"); }
function drawMonthPage(P,y,m){
  const M=36; P.page(); P.rect(0,0,P.W,6,ACC);
  P.text(M,46,MON[m]+" "+y,24,true,INK); P.text(P.W-M,46,(S.name||"")+"",12,true,INK,"right"); P.text(M,64,"Schichtplan · Schicht & Urlaub",9,false,GREY);
  const top=86, cw=(P.W-2*M)/7, rh=Math.round(92*P.H/841.89); ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"].forEach((d,i)=>P.text(M+i*cw+cw/2,top,d,9,true,GREY,"center"));
  const first=y+"-"+pad(m+1)+"-01"; let s=first; while(parse(s).getDay()!==1) s=addD(s,-1); let mins=0;
  for(let r=0;r<6;r++){ if(r===5 && +s.slice(5,7)!==m+1) break; for(let c=0;c<7;c++){ const x=M+c*cw, yy=top+8+r*rh, inM=+s.slice(5,7)===m+1, t=shiftOf(s), hn=holName(s);
      const isV=inM&&!!(t&&t.kind==="vac"); const isF=inM&&!isV&&(!t||t.kind==="free"); P.rect(x,yy,cw,rh,isV?hexRGB((vacType()||{color:"#2E8B57"}).color):(isF?[0.80,0.92,0.83]:(hn&&inM?[1,0.95,0.8]:null)),RULE,0.5); P.text(x+6,yy+14,String(parse(s).getDate()),11,true,isV?[1,1,1]:(inM?INK:[0.7,0.72,0.74]));
      if(!inM){ const ov=dayKind(s)==="v", o=ov?ownShift(s):t; if(o&&o.kind!=="free"){ const L=c2=>c2.map(v=>v+(1-v)*0.6); P.rect(x+6,yy+22,cw-12,34,L(hexRGB(o.color))); P.text(x+cw/2,yy+44,o.short,16,true,[1,1,1],"center"); if(ov) P.text(x+cw/2,yy+70,"Urlaub",8,true,[0.6,0.75,0.65],"center"); } else P.text(x+cw/2,yy+44,"frei",10,false,[0.75,0.77,0.79],"center"); }
      if(inM){ if(hn&&!isV) P.text(x+6,yy+rh-8,hn.slice(0,18),6.5,false,[0.6,0.42,0]);
        if(isV){ const o=ownShift(s); if(o&&o.kind==="work"){ P.rect(x+6,yy+22,cw-12,30,hexRGB(o.color),[1,1,1],1.2); P.text(x+cw/2,yy+42,o.short,15,true,isDark(o.color)?INK:[1,1,1],"center"); P.text(x+cw/2,yy+68,"Urlaub",11,true,[1,1,1],"center"); } else P.text(x+cw/2,yy+44,"Urlaub",14,true,[1,1,1],"center"); if(hn) P.text(x+6,yy+rh-8,hn.slice(0,18),6.5,false,[1,1,1]); }
        else if(isF){ P.text(x+cw/2,yy+44,"frei",14,true,[0.1,0.42,0.22],"center"); }
        else if(t){ P.rect(x+6,yy+22,cw-12,34,hexRGB(t.color)); P.text(x+cw/2,yy+44,t.short,16,true,isDark(t.color)?INK:[1,1,1],"center"); P.text(x+6,yy+68,t.name.slice(0,16),7.5,false,INK); if(t.kind==="work"&&t.start){ P.text(x+6,yy+78,t.start+"–"+t.end,7.5,false,GREY); mins+=minutes(t); } }
        else P.text(x+cw/2,yy+44,"frei",10,false,GREY,"center");
        const nt=S.notes[s]; if(nt) P.text(x+cw-6,yy+14,"•",12,true,[0.11,0.43,0.82],"right"); }
      s=addD(s,1); } }
  const ly=P.H-60; P.text(M,ly,"Arbeitszeit im "+MON[m]+": "+hStr(mins),10,true,INK);
  let lx=M; S.types.filter(t=>t.kind!=="free").forEach(t=>{ const lab=t.short+" = "+t.name; const w=tw(lab,8,false)+22; if(lx+w>P.W-M) return; P.rect(lx,ly+10,10,9,hexRGB(t.color)); P.text(lx+14,ly+18,lab,8,false,INK); lx+=w; }); P.rect(lx,ly+10,10,9,[0.80,0.92,0.83]); P.text(lx+14,ly+18,"frei",8,false,INK);
  P.text(M,P.H-22,"Schicht & Urlaub",7.5,false,GREY); P.text(P.W-M,P.H-22,"‹ Zum Inhalt",8,true,ACC,"right"); P.link(P.W-M-60,P.H-32,60,14,0); }
/* Nach dem Eintragen: Meldung mit „Rückgängig“ und wie viele Tage noch übrig sind */
let vacHL=null;
function vacToast(n,old){
  const nw=vacList().filter(v=>!old.some(o=>o.id===v.id&&o.a===v.a&&o.e===v.e)).sort((x,z)=>x.a<z.a?-1:1)[0]; if(nw){ uY=+nw.a.slice(0,4); vacHL=nw.id; setTimeout(()=>{ vacHL=null; },8000); if(view==="urlaub") renderUrlaub(); }
  const y=nw?+nw.a.slice(0,4):planYear(), r=vacTotal(y)-vacUsed(y);
  toast(n+(n===1?" Urlaubstag":" Urlaubstage")+" eingetragen · noch "+r+" übrig ("+y+")","Rückgängig",()=>{ S.vacs=old; save(); render(); const yo=$("#yplan"); if(yo&&!yo.hidden) drawYP(); }); }
/* Urlaubsliste als PDF */
async function pdfVac(y){
  const P=makePDF(), M=40; P.page(); P.rect(0,0,P.W,6,ACC); const bl=vacBlocks(y), used=vacUsed(y), tot=vacTotal(y);
  P.text(M,46,"Urlaub "+y,24,true,INK); P.text(M,64,(S.name?S.name+" · ":"")+"Schicht & Urlaub",9,false,GREY);
  [["Anspruch",String(tot)],["Verplant",String(used)],["Übrig",String(tot-used)]].forEach(([a,b],i)=>{ const x=M+i*170; P.rect(x,82,156,48,[0.94,0.95,0.95]); P.text(x+12,100,a.toUpperCase(),7.5,true,GREY); P.text(x+12,122,b,18,true,INK); });
  let yy=158; P.text(M,yy,"VON",7.5,true,GREY); P.text(M+200,yy,"BIS",7.5,true,GREY); P.text(P.W-M,yy,"URLAUBSTAGE",7.5,true,GREY,"right"); yy+=6; P.line(M,yy,P.W-M,yy,RULE);
  if(!bl.length){ yy+=20; P.text(M,yy,"Noch kein Urlaub eingetragen.",10,false,GREY); }
  bl.forEach(b=>{ yy+=22; if(yy>P.H-60){ P.page(); yy=60; } P.text(M,yy,fmt(b.a),10,true,INK); P.text(M+200,yy,fmt(b.e),10,true,INK); P.text(P.W-M,yy,String(b.n),10,true,INK,"right"); const fe=ferien(b.a); if(fe){ yy+=12; P.text(M,yy,fe[2],8,false,[0.48,0.31,0.77]); } yy+=6; P.line(M,yy,P.W-M,yy,RULE,0.5); });
  P.text(M,P.H-22,"Gezählt werden nur Tage, an denen laut Schichtplan gearbeitet wird. · Schicht & Urlaub",7.5,false,GREY);
  await pdfSave(P.build(),"Urlaub_"+y+".pdf"); }
boot();
