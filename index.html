<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Schicht &amp; Urlaub – abgeschaltet</title>
<style>
:root{--bg:#F2F4F3;--card:#fff;--ink:#16222B;--soft:#5B6873;--rule:#D5DBDE;--bad:#C0392B;--accent:#D9480F;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0F1519;--card:#172027;--ink:#E6ECEF;--soft:#94A2AC;--rule:#2A3740;--bad:#FF7B6E;--accent:#FF7A3D;--accent-ink:#1A0D05}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:460px;background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:22px 20px}
h1{font-size:23px;line-height:1.25;margin:0 0 10px}
p{margin:0 0 12px;color:var(--soft)}
button{width:100%;min-height:52px;border-radius:18px;font-family:inherit;font-weight:700;font-size:17px;line-height:1.2;cursor:pointer;margin-top:6px}
#del{background:transparent;border:2px solid var(--bad);color:var(--bad)}
#yes{background:var(--bad);border:0;color:#fff}
#no{background:transparent;border:2px solid var(--rule);color:var(--ink)}
#msg{font-weight:700;color:var(--ink);margin-top:12px}
</style>
</head>
<body>
<main>
  <h1>Die App „Schicht &amp; Urlaub“ wurde abgeschaltet.</h1>
  <p>Sie ist nicht mehr verfügbar. Die App wird jetzt auch von diesem Gerät entfernt.</p>
  <p>Deine bisherigen Einträge liegen nur auf diesem Gerät. Du kannst sie hier endgültig löschen.</p>
  <div id="act"><button id="del" type="button">Meine Daten auf diesem Gerät löschen</button></div>
  <p id="msg" role="status"></p>
</main>
<script>
/* App entfernen: Service Worker abmelden und Zwischenspeicher leeren (Einträge bleiben, bis man sie selbst löscht) */
(function(){
  try{ if(navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); }catch(e){}
  try{ if(window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); }catch(e){}
})();
var act=document.getElementById("act"), msg=document.getElementById("msg");
function keys(){ var o=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&k.indexOf("su_")===0) o.push(k); } }catch(e){} return o; }
function ask(){ act.innerHTML='<p>Wirklich alle Urlaube, Schichten und Einstellungen auf diesem Gerät löschen? Das kann man nicht rückgängig machen.</p><button id="yes" type="button">Ja, endgültig löschen</button><button id="no" type="button">Abbrechen</button>';
  document.getElementById("yes").onclick=function(){ keys().forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} }); try{ sessionStorage.clear(); }catch(e){} act.innerHTML=""; msg.textContent="Erledigt. Auf diesem Gerät sind keine Daten der App mehr gespeichert."; };
  document.getElementById("no").onclick=reset; }
function reset(){ act.innerHTML='<button id="del" type="button">Meine Daten auf diesem Gerät löschen</button>'; document.getElementById("del").onclick=ask; msg.textContent=keys().length?"":"Auf diesem Gerät sind keine Daten der App gespeichert."; if(!keys().length) act.innerHTML=""; }
reset();
</script>
</body>
</html>
